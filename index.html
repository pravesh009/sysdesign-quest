{id:'cap',title:'Consistency & CAP',icon:'⚖️',intro:'During a network partition you must choose: refuse to answer, or answer with possibly-stale data. Which one you pick is the whole personality of your system.',
 lessons:[
 {t:'CAP: what you give up when the network breaks',i:'🫁',b:`
<h5>What it is</h5>
<p>The <b>CAP theorem</b> says a distributed data store cannot simultaneously guarantee all three of: <b>Consistency</b> (every read returns the most recent write), <b>Availability</b> (every request gets a non-error response), and <b>Partition tolerance</b> (the system keeps working when nodes can't talk to each other).</p>

<h5>Why it exists</h5>
<p>Networks fail. Cables get cut, switches reboot, a cloud zone loses connectivity for 40 seconds. When two replicas can't talk, a client asks one of them for a value that may have been updated on the other. The node has exactly two honest options: answer with what it has (maybe stale — you kept A, dropped C) or refuse until it can check (correct or nothing — you kept C, dropped A). There is no third option. That's the whole theorem.</p>

<h5>How it works</h5>
<pre class="diag">           replication
 NODE A  ◄════════════►  NODE B        normal: writes replicate, reads are fresh everywhere
 x = 100                 x = 100

 NODE A  ◄──  ✂  ──►  NODE B          partition: A accepts write x=150. B can't hear about it.
 x = 150                 x = 100

 client asks B for x:
   AP system → "100"   (available, stale)
   CP system → error / wait   (consistent, unavailable)</pre>
<p>Because partitions <i>will</i> happen, P is not optional — the real choice is <b>CP vs AP</b>, and only for the duration of the partition. With the network healthy, a well-built system delivers all three. So "CP" and "AP" describe a system's <i>behaviour under failure</i>, not its everyday personality.</p>
<p>CP systems typically require a <b>quorum</b> — a majority of nodes — to acknowledge a write or serve a read. A minority partition can't reach a majority, so it stops serving. AP systems let every partition keep going and reconcile later.</p>

<h5>When to choose which</h5>
<ul><li><b>CP — refuse rather than lie:</b> money, inventory counts, seat/ticket booking, anything with a uniqueness constraint, leader election, configuration. A rejected request is retryable; a wrong answer isn't.</li>
<li><b>AP — answer, reconcile later:</b> social feeds, likes, view counts, product catalogues, recommendations, DNS, shopping carts (Amazon's classic example). Stale is barely noticeable; "down" loses money.</li>
<li><b>Per-operation, not per-system.</b> A real product has both: the cart is AP, the checkout is CP. Say which operations need which.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Amazon Dynamo</b> (the 2007 paper) is the canonical AP store — the shopping cart must always accept "add item", even if two data centres disagree, and conflicts are merged later (both items end up in the cart).</li>
<li><b>Google Spanner</b> is CP: globally distributed, but it uses synchronised clocks and Paxos so that a write is either consistently visible everywhere or the minority side refuses. It pays for this with higher write latency.</li>
<li><b>ZooKeeper / etcd</b> are CP by design — they store cluster configuration and leader locks, where a stale answer could put two nodes in charge of the same thing. During a partition the minority side goes read-only or refuses.</li></ul>

<h5>In the interview</h5>
<p>The question is rarely "explain CAP". It's <i>"Your two regions can't talk. What does a user in the smaller region see?"</i> Answer for each operation: "reads of the feed still work from local replicas (AP); placing an order fails fast with a retry message rather than risking a double-charge (CP)". Then the sharp follow-up: <i>"Isn't every database either CP or AP?"</i> — no: it's per operation and configurable; DynamoDB and Cassandra let you request a strongly-consistent read when you need one and pay the latency only then.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>During a partition a node must either answer possibly-stale (A) or refuse (C). P is mandatory.</li><li>CP for money, uniqueness, locks. AP for feeds, counts, catalogues, carts.</li><li>It's a choice per operation, made during failure — not a label for the whole system.</li></ul></div>`},

 {t:'Consistency models and quorums',i:'⏳',b:`
<h5>What it is</h5>
<p>A <b>consistency model</b> is the promise a system makes about what a read can return relative to earlier writes. "Strong" and "eventual" are the famous two; a few in between are what real systems actually offer.</p>

<h5>Why it exists</h5>
<p>Once data is copied to several nodes, "the current value" stops being a single thing — it's whatever each node has applied so far. Applications need to know what they're allowed to assume. A bank needs "if I just wrote it, I'll read it". A comment feed only needs "everyone converges eventually". Promising more than you need costs latency; promising less produces bugs that look random.</p>

<h5>How it works</h5>
<ul><li><b>Strong (linearizable):</b> once a write is acknowledged, every read anywhere returns it or something newer. Needs coordination on every write (a majority must agree) — cross-node round trips, ~ms to tens of ms.</li>
<li><b>Eventual:</b> if writes stop, all replicas converge to the same value eventually. No ordering promise in the meantime. Fast, and "eventually" is usually milliseconds.</li>
<li><b>Read-your-own-writes:</b> you always see your own updates; others may lag. The cheap fix for the "my edit vanished" bug.</li>
<li><b>Monotonic reads:</b> you never see time go backwards (read new value, then old value on a refresh). Achieved by pinning a session to one replica.</li>
<li><b>Causal:</b> if B depends on A (a reply to a comment), nobody sees B without A. The one people actually want for social products.</li></ul>
<p><b>Quorums</b> are the knob. With <code>N</code> replicas, a write waits for <code>W</code> acks and a read consults <code>R</code> replicas:</p>
<pre class="code">N = 3 replicas
W = 2, R = 2   →  W + R > N  → every read overlaps the latest write → strong-ish (quorum) consistency
W = 1, R = 1   →  fastest; may read stale                              → eventual
W = 3, R = 1   →  slow writes, fast strong reads (read-heavy)
W = 1, R = 3   →  fast writes, slow strong reads (write-heavy)

Cassandra lets you set this PER QUERY:  SELECT ... WITH CONSISTENCY QUORUM;</pre>
<p>Under the hood, strong consistency across replicas is usually a <b>consensus</b> protocol — Raft or Paxos — where a leader proposes each write and a majority must accept it before it's committed. That majority rule is why a CP system in the minority partition can't make progress.</p>

<h5>When to use which</h5>
<ul><li><b>Strong</b> for the small set of operations where a stale read causes a wrong decision: balances at withdrawal, "is this username taken", inventory at checkout, leader locks.</li>
<li><b>Read-your-own-writes + eventual</b> for nearly everything user-facing. It removes the bug users notice without paying for global coordination.</li>
<li><b>Tune quorums per query.</b> Default to fast; escalate to quorum for the few reads that matter.</li>
<li><b>Causal</b> for threaded content (comments, chat) when replies appearing before parents would be jarring.</li></ul>

<h5>In the wild</h5>
<ul><li><b>DynamoDB</b> defaults to eventually consistent reads (cheaper, faster) and offers <code>ConsistentRead=true</code> per request at double the read cost — the "pay only when it matters" model.</li>
<li><b>Cassandra</b> exposes N/R/W directly; a common production setting is <code>QUORUM</code> for both, giving strong consistency with one node's worth of failure tolerance.</li>
<li><b>Facebook's TAO</b> documents that it's eventually consistent across regions but read-your-own-writes within a session, because that's the model that removes visible bugs at acceptable cost.</li>
<li><b>etcd and Consul</b> run Raft: every write goes through the leader and a majority. Kubernetes stores all cluster state in etcd because "two nodes both think they own this pod" is not acceptable.</li></ul>

<h5>In the interview</h5>
<p>When you say "eventually consistent", the follow-up is <i>"What does the user actually see?"</i> Walk the scenario: they post, refresh, don't see their post — so add read-your-own-writes. Then: <i>"How would you get strong consistency for checkout?"</i> — quorum reads/writes (W+R&gt;N), or route checkout to the single leader. Mentioning that strong consistency is a per-operation cost, not a system setting, is the level-up.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Strong: reads see the latest write, paid for with coordination. Eventual: replicas converge, fast, briefly stale.</li><li>Read-your-own-writes fixes the bug users see; use it by default.</li><li>Quorums: W + R &gt; N gives overlap; tune per query. Consensus (Raft/Paxos) is how a majority agrees.</li></ul></div>`},

 {t:'Transactions, isolation and the cross-service problem',i:'🧾',b:`
<h5>What it is</h5>
<p>A <b>transaction</b> groups several reads and writes so they either all take effect or none does, and so concurrent transactions don't see each other's half-finished work. <b>ACID</b> names the guarantees: Atomic, Consistent (constraints hold), Isolated, Durable.</p>

<h5>Why it exists</h5>
<p>Transfer $50: subtract from A, add to B. If the process dies between the two, money vanishes. If another transaction reads between the two, it sees $50 missing from the world. Transactions make "both or neither" and "nobody sees the middle" the database's problem instead of yours — within one database. The moment the two accounts live in different databases or services, that guarantee is gone, and you need a different tool.</p>

<h5>How it works</h5>
<p><b>Isolation levels</b> trade correctness for concurrency. From weakest to strongest:</p>
<ul><li><b>Read committed:</b> you never see uncommitted writes. Postgres default. Two reads in one transaction can differ.</li>
<li><b>Repeatable read / snapshot:</b> your transaction sees a frozen snapshot. MySQL InnoDB default. Prevents most anomalies.</li>
<li><b>Serializable:</b> as if transactions ran one at a time. Correct always; may abort transactions that conflict, so you must retry.</li></ul>
<pre class="code">-- The classic race: two requests both check stock, both see 1, both sell it.
BEGIN;
SELECT stock FROM items WHERE id = 7 FOR UPDATE;   -- row lock: the second request WAITS here
UPDATE items SET stock = stock - 1 WHERE id = 7 AND stock > 0;
COMMIT;

-- Or optimistic: no lock, detect the conflict at write time
UPDATE items SET stock = stock - 1, version = version + 1
 WHERE id = 7 AND version = 41;      -- affected rows = 0 → someone else got there; retry</pre>
<p><b>Across services</b> there is no shared transaction. Two patterns:</p>
<ul><li><b>Two-phase commit (2PC):</b> a coordinator asks every participant "can you commit?", then tells them all "commit". Gives atomicity, but the coordinator is a bottleneck and a SPOF, and participants hold locks while waiting. Rare in modern services.</li>
<li><b>Saga:</b> a sequence of local transactions, each publishing an event that triggers the next. If step 3 fails, run <i>compensating</i> actions to undo steps 2 and 1 (refund the charge, release the reservation). No global lock; the system is briefly inconsistent by design, and every step must be idempotent.</li></ul>
<pre class="diag">Saga: order placed → payment charged → inventory reserved → shipping booked
                                            ✗ fails
      compensate:  ← refund payment    ← cancel order</pre>

<h5>When to use which</h5>
<ul><li><b>One database, one transaction.</b> Keep related data in the same DB when you can precisely so this stays simple.</li>
<li><b>Pessimistic locks</b> (<code>FOR UPDATE</code>) when conflicts are common and short (inventory decrement). <b>Optimistic</b> (version column) when conflicts are rare and you don't want lock waits.</li>
<li><b>Serializable</b> only for the operations where anomalies are unacceptable; it costs throughput.</li>
<li><b>Sagas</b> across services; <b>2PC</b> almost never, unless a database offers it internally (Spanner, CockroachDB do this for you).</li></ul>

<h5>In the wild</h5>
<ul><li><b>Airbnb's payments</b> use idempotency keys plus a saga-like orchestration so a failed step (bank declines) reliably unwinds the earlier ones, and a retried step never charges twice.</li>
<li><b>Uber</b> processes a trip as a saga across pricing, matching and payment services; each step emits an event, and compensations handle cancellations.</li>
<li><b>Postgres</b> ships serializable isolation via SSI (serializable snapshot isolation), which detects conflicts rather than locking — you just have to retry on serialization failure.</li></ul>

<h5>In the interview</h5>
<p>The prompt is a race: <i>"Two people buy the last ticket at the same moment."</i> Answer with a row lock or an atomic conditional update, and say why it works (the second request waits or gets zero rows). Then the escalation: <i>"Tickets are in one service, payments in another."</i> Answer: saga with compensations, idempotent steps, and the honest admission that the system is inconsistent for a few hundred milliseconds — and why that's fine here.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>ACID makes "all or nothing" and "no half-states" the database's job — inside one database.</li><li>Prevent races with a row lock (FOR UPDATE) or an atomic conditional update with a version.</li><li>Across services: sagas with compensating actions and idempotent steps. 2PC is rare.</li></ul></div>`},

 {t:'PACELC and tunable consistency: how real systems choose',i:'🧠',b:`
<h5>What it is</h5>
<p><b>PACELC</b> extends CAP: if there's a <b>P</b>artition, choose <b>A</b> or <b>C</b>; <b>E</b>lse (network healthy), choose <b>L</b>atency or <b>C</b>onsistency. It captures the trade-off you pay every day, not just on the bad day.</p>

<h5>Why it exists</h5>
<p>CAP is about failures, which are rare. But even when everything is healthy, strong consistency has a cost: a write must be confirmed by a majority of replicas before it's acknowledged, and if those replicas are in different regions, that's a round trip across an ocean — 100 ms or more, on every write. PACELC names that cost so you can decide whether each operation is worth it.</p>

<h5>How it works</h5>
<pre class="diag">                     partition?
                    /          \\
                 yes            no
                /                 \\
        A  or  C            L  or  C
   (keep serving  (refuse)  (fast,    (coordinate,
    stale)                   maybe     always
                             stale)    right)

Dynamo / Cassandra / DynamoDB(default)   PA / EL    fast & available; reconcile later
Spanner / CockroachDB / etcd             PC / EC    always right; pays latency
Postgres (single leader + async replica) PC / EL    right at the leader; replica reads fast, maybe stale
MongoDB (default)                        PA / EC-ish leader reads are consistent; failover favours availability</pre>
<p>The practical form of this is <b>tunable consistency</b>: the system defaults to fast/eventual and lets the caller escalate per request.</p>
<pre class="code"># DynamoDB: eventual by default, strong on request (2× read cost)
table.get_item(Key={"id": 42}, ConsistentRead=True)

# Cassandra: consistency level per statement
session.execute(stmt, consistency_level=ConsistencyLevel.LOCAL_QUORUM)

# Design rule of thumb inside one app:
#   default          → eventual / local replica     (99% of reads)
#   after own write  → read-your-own-writes          (route to leader briefly)
#   money / unique   → quorum or leader              (the 1% that matters)</pre>

<h5>When to use which</h5>
<ul><li><b>PA/EL</b> (Dynamo family) for globally distributed, user-facing, read-heavy products where staleness is invisible: catalogues, feeds, sessions, carts.</li>
<li><b>PC/EC</b> (Spanner family) when correctness is worth paying latency on every write: financial ledgers, inventory of scarce goods, global configuration.</li>
<li><b>Single-leader relational</b> for the vast middle: strong at the leader, fast eventual reads from replicas, and you route the few reads that must be fresh to the leader.</li>
<li><b>Multi-region:</b> keep writes in one region (simplest), or accept multi-leader with conflict resolution for the specific tables that need local writes.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Google Spanner</b> uses GPS and atomic clocks ("TrueTime") so replicas across continents agree on ordering, giving external consistency at the cost of waiting out clock uncertainty on each commit — typically several milliseconds.</li>
<li><b>Amazon DynamoDB Global Tables</b> replicate across regions with last-writer-wins conflict resolution — PA/EL by design, with strong reads available only within a single region.</li>
<li><b>Cassandra at Netflix</b> runs <code>LOCAL_QUORUM</code>: strong within a region (fast, no ocean crossing), eventual across regions. This is the most common real-world compromise.</li></ul>

<h5>In the interview</h5>
<p>Bringing up PACELC unprompted, correctly, is a senior-flavoured move at mid-level. Use it when asked about multi-region: "Even without a partition, strongly consistent cross-region writes cost a round trip, so I'd keep writes region-local with LOCAL_QUORUM and accept eventual consistency across regions for the feed — and for checkout I'd route to a single home region." That sentence shows you know the trade-off is continuous, not just a failure mode.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>PACELC: during partition choose A or C; otherwise choose latency or consistency. The cost is everyday, not just on failure.</li><li>Tunable consistency: default fast, escalate per request for the few operations that must be right.</li><li>LOCAL_QUORUM (strong in-region, eventual cross-region) is the common production compromise.</li></ul></div>`}],
 lab:'cap',
 quiz:[
 {q:'A partition splits your payment ledger cluster. Which do you sacrifice?',o:['Consistency — serve possibly stale balances','Availability — reject writes until healed','Partition tolerance','Nothing, use eventual consistency'],a:1,w:'Money is CP. A rejected request is recoverable; a double-spend is not.'},
 {q:'Which is TRUE about CAP?',o:['You permanently lose one of the three','You choose C or A only during a partition','NoSQL is always AP','SQL is always CP'],a:1,w:'CAP constrains behavior during partitions. Without a partition you can have all three. Database type doesn\'t determine CP/AP — configuration does.'},
 {q:'Two users on different replicas both register username "trex". What prevents it?',o:['Eventual consistency','A TTL','A single leader or consensus-based write','A CDN'],a:2,w:'Uniqueness needs a single decision point — a leader or a quorum agreeing before either write is acknowledged.'}]},

{id:'api',title:'APIs & Rate Limiting',icon:'🔌',intro:'Mid-level candidates are expected to write the API contract before drawing boxes. Get the verbs, the idempotency, and the throttling right.',
 lessons:[
 {t:'Designing an API people can build on',i:'🧾',b:`
<h5>What it is</h5>
<p>An <b>API</b> is the contract between your system and everything that calls it. In an interview it's also the first artefact you produce after requirements — because writing the endpoints forces you to decide what the system actually does before you draw a single box.</p>

<h5>Why it exists</h5>
<p>A bad API is forever. Clients get built against it, mobile apps ship with it baked in, partners integrate it, and every change becomes a migration. Good API design is mostly about being predictable: a developer who has used one endpoint should be able to guess the rest.</p>

<h5>How it works</h5>
<p>REST conventions, which are conventions precisely because they make the API guessable:</p>
<pre class="code">Resources are nouns; HTTP verbs are the actions.
GET    /users/42               read
POST   /users                  create      → 201 Created, Location: /users/43
PUT    /users/42               replace     (idempotent)
PATCH  /users/42               partial     (idempotent if designed so)
DELETE /users/42               delete      (idempotent: second call → 404 or 204, never an error)

Nesting expresses ownership:   GET /users/42/orders
Filtering, not new endpoints:  GET /orders?status=shipped&since=2026-09-01

Pagination — always. Offset pagination breaks under inserts; cursor pagination doesn't.
GET /orders?limit=50&cursor=eyJpZCI6MTAwfQ
→ { "items": [...], "next_cursor": "eyJpZCI6MTUwfQ" }

Versioning: /v2/users  or  Accept: application/vnd.myapi.v2+json
Errors: a stable shape, always.
{ "error": { "code": "INSUFFICIENT_FUNDS", "message": "...", "retryable": false } }</pre>
<p>Status codes carry meaning: <code>400</code> the client sent garbage, <code>401</code> who are you, <code>403</code> you can't, <code>404</code> nothing there, <code>409</code> conflict (duplicate, version mismatch), <code>429</code> slow down, <code>5xx</code> our fault. Clients branch on these; get them right.</p>

<h5>When to break the rules</h5>
<ul><li><b>Actions that aren't CRUD</b> — "send this invoice", "retry this job": <code>POST /invoices/42/send</code>. A verb sub-resource is clearer than pretending it's an update.</li>
<li><b>Bulk operations</b>: <code>POST /users/batch</code> with a list, returning per-item results. Don't make clients do 500 calls.</li>
<li><b>Long-running work</b>: return <code>202 Accepted</code> with a job URL to poll, or a webhook to call back. Never hold the connection for minutes.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Stripe's API</b> is the reference everyone copies: consistent nouns, cursor pagination everywhere, a single error shape, and versioning by date pinned per account so old integrations never break.</li>
<li><b>GitHub</b> offers both REST and GraphQL; their REST docs show the "nested resource" pattern at scale (<code>/repos/{owner}/{repo}/issues/{n}/comments</code>).</li>
<li><b>Twilio</b> pioneered <code>202 Accepted</code> + status callbacks for SMS: the API returns instantly and tells you later whether the message delivered.</li></ul>

<h5>In the interview</h5>
<p>After requirements, say "let me define the API" and write three or four endpoints with request/response shapes. It's five minutes that anchors the whole design — the interviewer can now ask "what happens when a client calls <code>POST /shorten</code>" and you can trace it through your boxes. Include pagination on any list endpoint and mention idempotency on any write; those two are the details that get asked about.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Nouns for resources, verbs from HTTP. Predictable beats clever.</li><li>Cursor pagination on every list; a single error shape; versioning from day one.</li><li>Long work returns 202 and a way to check back.</li></ul></div>`},

 {t:'REST vs GraphQL vs gRPC',i:'🔀',b:`
<h5>What it is</h5>
<p>Three ways to shape the conversation between a client and a server. <b>REST</b>: resources over HTTP, JSON. <b>GraphQL</b>: one endpoint, the client writes a query describing exactly the fields it wants. <b>gRPC</b>: binary messages (Protocol Buffers) over HTTP/2 with generated client code and streaming.</p>

<h5>Why it exists</h5>
<p>REST's weakness is fixed response shapes: a mobile screen that needs a user's name, their last three orders and each order's first item makes four round trips (under-fetching) and receives every field of every object (over-fetching). GraphQL was built at Facebook to fix exactly that for mobile. gRPC's motivation is different: inside a data centre, parsing JSON and opening HTTP/1.1 connections is the bottleneck, and Google wanted something ten times cheaper for service-to-service calls.</p>

<h5>How it works</h5>
<pre class="code"># REST — 2 requests, fixed shapes
GET /users/42                → { id, name, email, bio, avatar, created_at, ... }
GET /users/42/orders?limit=3 → [ { id, total, items:[...], shipping:{...}, ... } ]

# GraphQL — 1 request, exact shape
query { user(id: 42) { name orders(last: 3) { total items(first: 1) { name } } } }
→ { "user": { "name": "T", "orders": [ { "total": 40, "items": [ { "name": "Chalk" } ] } ] } }

# gRPC — define once, generate clients in every language
service Users { rpc GetUser (GetUserRequest) returns (User); }
message User { int64 id = 1; string name = 2; }
# binary on the wire (~3–10× smaller than JSON), HTTP/2 multiplexing, bidirectional streams</pre>
<p>GraphQL's hidden cost is the <b>N+1 problem</b>: a query for 100 orders and each order's user naively triggers 101 database calls. Every serious GraphQL server uses a <i>DataLoader</i> to batch those. Its other cost is caching — every query is a POST to one URL, so HTTP caching and CDNs don't help by default.</p>
<p>gRPC's hidden cost is the browser: browsers can't speak raw gRPC, so you need a proxy (grpc-web, Envoy) or you expose REST at the edge and gRPC inside.</p>

<h5>When to use which</h5>
<ul><li><b>REST</b> for public APIs, anything cacheable, anything simple. It's the default because everyone and everything speaks it.</li>
<li><b>GraphQL</b> when one client (usually mobile or a rich web UI) needs many different shapes of the same data and round trips are expensive. Owning the client matters — GraphQL for third parties invites abusive queries.</li>
<li><b>gRPC</b> for service-to-service inside your system: low latency, strong typing, streaming. Nearly every microservice shop uses it internally and REST/GraphQL at the edge.</li>
<li><b>Streaming</b> (server push, bidirectional) is native in gRPC; in REST-land you'd reach for WebSockets or SSE.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Facebook / Meta</b> invented GraphQL for the mobile app in 2012 and still run essentially all client traffic through it.</li>
<li><b>GitHub</b> moved its v4 API to GraphQL because integrators kept asking for "just these three fields" — and kept REST v3 alive because most integrations are simple.</li>
<li><b>Netflix, Uber, Google</b> run gRPC between services; Google's internal RPC (Stubby) is where gRPC came from. Uber reported significant CPU savings moving hot paths from JSON to Protobuf.</li></ul>

<h5>In the interview</h5>
<p>Give the two-tier answer and you're done: "REST (or GraphQL, if the client is a complex UI) at the edge, gRPC between services." If asked why not GraphQL everywhere: caching is harder, N+1 needs batching, and public GraphQL needs query cost limits. If asked why not gRPC at the edge: browsers, debuggability, and third-party developers expect JSON.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>REST: simple, cacheable, universal; fixed shapes over/under-fetch.</li><li>GraphQL: client picks fields, one round trip; needs DataLoader for N+1, weak on HTTP caching.</li><li>gRPC: binary, typed, streaming, fast; not browser-native. Use it inside.</li></ul></div>`},

 {t:'Idempotency and safe retries',i:'🔁',b:`
<h5>What it is</h5>
<p>An operation is <b>idempotent</b> if doing it twice has the same effect as doing it once. <code>GET</code>, <code>PUT</code>, <code>DELETE</code> are idempotent by definition. <code>POST</code> — "create a thing", "charge a card" — is not, and that is where every double-charge bug in history comes from.</p>

<h5>Why it exists</h5>
<p>Networks lose responses. The client sends <code>POST /charge</code>, the server charges the card, and the reply is lost in a timeout. The client has no way to know whether the charge happened. Its only options are "don't retry" (maybe the customer isn't charged and the order is lost) or "retry" (maybe they're charged twice). Idempotency keys give it a third option: retry safely.</p>

<h5>How it works</h5>
<pre class="code"># Client: generate one key per logical operation, reuse it on retries
key = uuid4()                                # generated ONCE, before the first attempt
POST /charges  Idempotency-Key: 3f9a-...     { amount: 5000, card: tok_x }
# timeout → retry with the SAME key

# Server:
def create_charge(req):
    k = req.headers["Idempotency-Key"]
    cached = store.get("idem:"+k)            # Redis or a table, TTL ~24h
    if cached:
        if cached.status == "in_progress": return 409  # concurrent duplicate; client should wait
        return cached.response                # replay the original result
    store.set("idem:"+k, {status:"in_progress"}, nx=True)   # atomic: only one request wins
    resp = do_charge(req)
    store.set("idem:"+k, {status:"done", response: resp})
    return resp</pre>
<p>Three details that separate a working implementation from a broken one: the key is tied to the <i>request body</i> (same key + different body → 422, not a replay); the "in progress" marker is set <i>atomically</i> so two concurrent retries can't both run; and the stored response is exactly what the first call returned, status code included.</p>
<p>Idempotency also lives at the database level: <code>INSERT ... ON CONFLICT DO NOTHING</code>, or a unique constraint on <code>(user_id, client_request_id)</code>, makes the write itself safe to repeat.</p>

<h5>When to use it</h5>
<ul><li><b>Always</b> on any endpoint that creates or moves something valuable: payments, orders, transfers, sending an email, provisioning a resource.</li>
<li><b>Every message-queue consumer.</b> At-least-once delivery means every consumer will see duplicates; the handler must be idempotent (Level 6).</li>
<li><b>Every retry you write</b> should be guarded by it. Retrying a non-idempotent call is how you double-charge people.</li>
<li><b>Not needed</b> for reads or for naturally idempotent writes ("set status = shipped").</li></ul>

<h5>In the wild</h5>
<ul><li><b>Stripe</b> requires an <code>Idempotency-Key</code> on all POSTs, stores results for 24 hours, and returns the original response on replay. Their docs are the reference implementation.</li>
<li><b>Airbnb</b> built "Orpheus", an idempotency framework for their payments platform, after finding that retries across their microservices were the main source of double-payments.</li>
<li><b>AWS APIs</b> use a <code>ClientToken</code> parameter for the same purpose on resource-creating calls (RunInstances, CreateQueue).</li></ul>

<h5>In the interview</h5>
<p>Any payment or booking design will get <i>"the request times out — what now?"</i> Answer: idempotency key, generated client-side, stored server-side with the response, replayed on retry. Then the follow-ups: <i>"Where's it stored and for how long?"</i> (Redis or DB, ~24h TTL); <i>"Two retries arrive at once?"</i> (atomic set-if-absent; second gets 409 or waits); <i>"Same key, different amount?"</i> (reject). Say all four before they ask and you've closed the topic.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Idempotent = safe to repeat. POST isn't; make it so with a client-generated Idempotency-Key.</li><li>Server stores key → response atomically, replays on retry, rejects mismatched bodies.</li><li>Every retry and every queue consumer relies on this. Payments without it are a bug waiting to happen.</li></ul></div>`},

 {t:'Rate limiting and the API gateway',i:'🚧',b:`
<h5>What it is</h5>
<p>A <b>rate limiter</b> caps how many requests a client can make in a window and rejects the rest with <code>429</code>. An <b>API gateway</b> is the front door where that happens — along with authentication, routing, and the other things every endpoint needs but no endpoint should implement itself.</p>

<h5>Why it exists</h5>
<p>Without limits, one misbehaving client — a bug in a retry loop, a scraper, an attacker — consumes capacity meant for everyone. Rate limiting is fairness enforcement, abuse prevention, and the basis of pricing tiers ("1,000 requests/day free"). The gateway exists because auth, limits, TLS and logging are cross-cutting: implement them once at the edge, not in fifty services.</p>

<h5>How it works</h5>
<pre class="code"># Token bucket — the industry default. Allows bursts up to the bucket size.
class TokenBucket:                       # capacity=10, refill=2 per second
    def allow(self):
        self.tokens = min(self.cap, self.tokens + (now() - self.last) * self.rate)
        self.last = now()
        if self.tokens >= 1: self.tokens -= 1; return True
        return False

# Sliding window counter — smoother than fixed windows, cheap to store
#   count = this_window_count + prev_window_count × (overlap fraction)

# Fixed window — "100/min", reset on the minute. Simple. Leaks: 100 at :59 + 100 at :00.

# Distributed: counters live in Redis so every gateway instance sees the same numbers
key = f"rl:{client_id}:{minute}"
n = redis.incr(key); redis.expire(key, 60)      # or a Lua script to make it atomic
if n > LIMIT: return 429, {"Retry-After": seconds_left}</pre>
<p>What to limit <i>by</i>: API key (fair per customer), user ID (fair per person), IP (anonymous traffic; blunt behind NAT), or endpoint (expensive calls get lower limits). Real gateways stack several.</p>
<p>The <b>gateway</b> itself: terminate TLS, authenticate (validate JWT / API key), rate limit, route to the right service by path, retry/timeout on its behalf, log and trace every call, and sometimes cache responses or aggregate several backend calls into one (the "backend for frontend" pattern). Kong, Envoy, AWS API Gateway, Nginx.</p>

<h5>When to use which</h5>
<ul><li><b>Token bucket</b> by default: lets a client burst briefly, enforces the average.</li>
<li><b>Sliding window</b> when the edge-leak of fixed windows matters (billing, strict quotas).</li>
<li><b>Leaky bucket</b> when you want to <i>smooth</i> traffic into a backend rather than reject it (queue and drain at a fixed rate) — adds latency.</li>
<li><b>Local vs central counters:</b> Redis-backed for accuracy; per-instance counters when a little over-admission is fine and you don't want a Redis hop on every request.</li>
<li><b>A gateway</b> once you have more than a couple of services or any external developers. A single monolith can do this itself.</li></ul>

<h5>In the wild</h5>
<ul><li><b>GitHub's API</b> returns <code>X-RateLimit-Limit</code>, <code>-Remaining</code> and <code>-Reset</code> headers on every response so clients can self-throttle — a courtesy most good APIs copy.</li>
<li><b>Stripe</b> documents a token-bucket limiter plus a separate concurrency limiter, and describes shedding load at the gateway during incidents before it reaches the databases.</li>
<li><b>Cloudflare</b> runs rate limiting at the edge across hundreds of data centres using eventually-consistent counters — deliberately imprecise, because exactness would require a global round trip per request.</li>
<li><b>Netflix Zuul</b> is the canonical L7 gateway: auth, routing, canary splits, and load shedding for every request entering Netflix.</li></ul>

<h5>In the interview</h5>
<p>"Design a rate limiter" is a common warm-up. The expected answer: token bucket per client, counters in Redis with TTL, atomic increment (Lua script), <code>429</code> with <code>Retry-After</code>, enforced at the API gateway. Follow-ups: <i>"Multiple gateway instances?"</i> — shared Redis; <i>"Redis is down?"</i> — fail open (allow) for availability or fail closed for safety, and say which; <i>"Multi-region?"</i> — per-region limits, accept slight over-admission.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Token bucket by default: bursts allowed, average enforced. Counters in Redis with atomic INCR + TTL.</li><li>Return 429 with Retry-After and rate-limit headers.</li><li>The API gateway is where auth, limits, routing and logging live — once, at the edge.</li></ul></div>`}],
 lab:'bucket',
 quiz:[
 {q:'A charge request times out and the client retries. What prevents a double charge?',o:['Rate limiting','Idempotency key','Using PUT','A circuit breaker'],a:1,w:'Idempotency keys make retries safe. Rate limiting stops abuse but would happily let a legitimate retry charge twice.'},
 {q:'Service A calls Service B 50k times/sec internally with strict latency. Protocol?',o:['REST + JSON','GraphQL','gRPC','WebSockets'],a:2,w:'gRPC: binary, typed, multiplexed over HTTP/2. Built for exactly this.'},
 {q:'"100 requests/minute" implemented as a fixed window. What\'s the flaw?',o:['Uses too much memory','Allows ~200 requests across a window boundary','Can\'t be distributed','Doesn\'t support bursts'],a:1,w:'Fixed windows reset abruptly. A client can send 100 at :59 and 100 at :00. Sliding windows or token buckets fix this.'}]},

{id:'async',title:'Queues & Async',icon:'📬',intro:'Not everything belongs in the request path. Queues absorb spikes, decouple services, and let you retry safely.',
 lessons:[
 {t:'Synchronous vs asynchronous: what belongs in the request',i:'⏱️',b:`
<h5>What it is</h5>
<p>A <b>synchronous</b> call waits for the answer. An <b>asynchronous</b> one hands the work off and moves on; the result arrives later, or never needs to come back at all. Deciding which work is which is the single most important structural decision after the database.</p>

<h5>Why it exists</h5>
<p>A user uploads a video. The upload takes 3 seconds; transcoding it takes 4 minutes. If the request handler does both, the user stares at a spinner, the HTTP connection is held open for 4 minutes, and a server can only handle as many uploads as it has threads. Worse: if transcoding fails, the upload failed too, and the user has to start over. Most of that 4 minutes of work doesn't need the user to wait — it needs to <i>eventually happen</i>.</p>

<h5>How it works</h5>
<pre class="diag">SYNC:   client ──POST /video──►  server: save + transcode + thumbnail + notify (4 min) ──►  200
                                  one thread blocked for 4 min; any failure fails everything

ASYNC:  client ──POST /video──►  server: save file, write job to queue (50 ms) ──►  202 { job: 91 }
                                                                │
                                              queue ──► worker: transcode (4 min)
                                                    ──► worker: thumbnail
                                                    ──► worker: notify
        client ──GET /jobs/91──►  { status: "processing" }   (poll)   or a webhook / push when done</pre>
<p>The request path shrinks to: validate, persist the minimum, enqueue, respond. Everything else becomes a <b>job</b> that a pool of <b>workers</b> pulls from a <b>queue</b>. Workers can be slow, can fail and retry, can be scaled independently of web servers — and the user got their answer in 50 ms.</p>
<p>The split changes what the API promises: <code>202 Accepted</code> means "I have your request" not "it's done". You need a way to report completion: polling a status endpoint, a webhook to the client, a push notification, or a WebSocket event.</p>

<h5>When to go async</h5>
<ul><li><b>Async:</b> anything slow (transcoding, report generation), anything that talks to a third party (email, SMS, payment webhooks), anything that fans out (notify 10,000 followers), anything that can tolerate a delay of seconds.</li>
<li><b>Sync:</b> anything the user needs to continue — login, "is this username free", the final price at checkout, reading data.</li>
<li><b>The tell:</b> if the user would be fine seeing "we'll email you when it's ready", it's async. If they'd refresh the page waiting for it, it's sync.</li>
<li><b>Don't make it async just because you can.</b> Every async step needs status tracking, retries, and a way to surface failures. That's real complexity; spend it where the latency or reliability win is real.</li></ul>

<h5>In the wild</h5>
<ul><li><b>YouTube</b>: upload finishes in seconds and shows "processing"; transcoding to a dozen resolutions runs on a job pipeline, and the video becomes watchable progressively as each rendition completes.</li>
<li><b>Instagram</b>: posting returns instantly. Fan-out to followers' feeds, push notifications, search indexing and thumbnail generation are four separate async consumers of one "post created" event.</li>
<li><b>Stripe</b>: charging a card is sync (you need the answer), but everything that follows — receipts, webhooks to the merchant, fraud scoring updates — is queued.</li></ul>

<h5>In the interview</h5>
<p>Whenever your design has a slow step, say "that's async" and draw the queue. The follow-up is always <i>"How does the user know it's done?"</i> — polling a job endpoint (simple), a webhook (server-to-server), or a push/WebSocket (user-facing). Then <i>"What if the worker fails?"</i> — the job returns to the queue and is retried, with a dead-letter queue after N attempts (Level 6, lesson 2). Mentioning that the request path only does "validate, persist, enqueue, respond" is the mid-level phrasing.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Sync when the user needs the answer to continue. Async for slow, third-party, fan-out, or delay-tolerant work.</li><li>Request path: validate, persist, enqueue, respond 202. Workers do the rest and scale independently.</li><li>Async needs a completion story: poll, webhook, or push.</li></ul></div>`},

 {t:'Message queues: anatomy and guarantees',i:'📬',b:`
<h5>What it is</h5>
<p>A <b>message queue</b> is durable storage for work that hasn't happened yet. Producers put messages in; consumers take them out, do the work, and acknowledge. The queue holds each message safely until it's acknowledged, and hands it to someone else if the consumer dies.</p>

<h5>Why it exists</h5>
<p>The queue solves four problems at once. <b>Decoupling:</b> the producer doesn't know who processes the message or whether they're running right now. <b>Buffering:</b> a spike of 10,000 messages waits in line instead of crashing the consumer. <b>Reliability:</b> a message survives consumer crashes and broker restarts. <b>Independent scaling:</b> backlog growing? Add consumers. Nothing else changes.</p>

<h5>How it works</h5>
<pre class="diag">producer ──► [ m1 m2 m3 m4 m5 ] ──► consumer A  (takes m1, processes, ACKs)
              queue (durable)   ──► consumer B  (takes m2 ... crashes before ACK)
                                        └── after visibility timeout, m2 is redelivered to A</pre>
<pre class="code"># Producer
queue.send({"type": "video.transcode", "video_id": 91, "attempt": 0})

# Consumer loop
while True:
    msg = queue.receive(visibility_timeout=300)   # message hidden from others for 5 min
    try:
        handle(msg)                               # must be idempotent — this may run twice
        queue.ack(msg)                            # only now is it deleted
    except Exception:
        if msg.attempts >= 5: queue.move_to_dlq(msg)   # poison pill → dead-letter queue
        else: queue.nack(msg, delay=2 ** msg.attempts)  # retry with backoff</pre>
<p>The pieces that matter:</p>
<ul><li><b>Ack:</b> the consumer confirms success; only then is the message removed. Crash before ack → redelivered. This is what makes the queue reliable — and why consumers see duplicates.</li>
<li><b>Visibility timeout:</b> how long a message is hidden while a consumer works on it. Too short → duplicate processing; too long → slow recovery from crashes.</li>
<li><b>Dead-letter queue (DLQ):</b> after N failed attempts a message is parked aside. Without it one malformed message ("poison pill") is retried forever and blocks everything behind it.</li>
<li><b>Ordering:</b> most queues are FIFO-ish, not strictly ordered across consumers. Strict ordering needs a single consumer or partitioning by key (Kafka, SQS FIFO with message groups).</li>
<li><b>Backpressure:</b> queue depth is the health metric. Rising depth = consumers can't keep up; alert on it and autoscale workers on it.</li></ul>

<h5>When to use which</h5>
<ul><li><b>Managed queue (SQS, Cloud Tasks, Azure Queue)</b> for task queues where you want zero ops: at-least-once, DLQ built in, scales itself.</li>
<li><b>RabbitMQ</b> when you need routing rules (topic exchanges, priorities, per-consumer queues) and low per-message latency at moderate scale.</li>
<li><b>Kafka</b> (next lesson) when you need replay, strict per-key ordering, many independent consumers of the same stream, or millions of messages a second.</li>
<li><b>A database table as a queue</b> is fine at small scale and gives you transactions with your business data — but polling doesn't scale and locks get ugly. Graduate when it hurts.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Shopify</b> runs tens of thousands of background jobs per second through Sidekiq on Redis for everything from webhooks to inventory sync, with a DLQ ("morgue") reviewed by humans.</li>
<li><b>Amazon SQS</b> was AWS's second service ever (2004), before EC2 — a hint at how fundamental a durable queue is to building services.</li>
<li><b>Slack</b> pushes every message delivery, notification and unfurl through job queues; their engineering blog describes migrating the queue layer under load without dropping a message.</li></ul>

<h5>In the interview</h5>
<p>Once you draw a queue, three questions follow: <i>"What if the consumer crashes mid-job?"</i> (no ack → redelivered after the visibility timeout, so handlers are idempotent), <i>"What if a message always fails?"</i> (DLQ after N attempts, alert a human), <i>"How do you know you're falling behind?"</i> (queue depth and oldest-message age; scale consumers on them). Saying "idempotent consumer" and "dead-letter queue" unprompted is the mid-level signal.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>A queue decouples, buffers, survives crashes, and lets consumers scale on their own.</li><li>Ack after success; unacked messages are redelivered — so consumers must be idempotent.</li><li>Dead-letter queue for poison pills; queue depth and message age are the health metrics.</li></ul></div>`},

 {t:'Pub/sub and event streams (Kafka)',i:'📡',b:`
<h5>What it is</h5>
<p>In a <b>queue</b>, one message goes to one consumer. In <b>pub/sub</b>, one message goes to every subscriber of a topic. An <b>event stream</b> (Kafka's model) is pub/sub over a durable, ordered log: messages aren't deleted when read, each consumer tracks its own position, and you can rewind.</p>

<h5>Why it exists</h5>
<p>When a user places an order, five things need to happen: charge, reserve stock, email, update analytics, notify the warehouse. With a plain queue you'd either write one consumer that does all five (coupled, slow, fragile) or have the producer send five messages to five queues (the producer now knows about everyone). Pub/sub inverts it: the producer publishes one <code>order.placed</code> event and doesn't know or care who listens. Adding a sixth consumer changes nothing upstream.</p>

<h5>How it works</h5>
<pre class="diag">                     topic: order.placed
producer ──► ┌─────────────────────────────────┐
             │ partition 0: e1 e4 e7 ...        │──► consumer group "billing"   (offset per partition)
             │ partition 1: e2 e5 e8 ...        │──► consumer group "email"     (independent offset)
             │ partition 2: e3 e6 e9 ...        │──► consumer group "analytics" (can replay from 0)
             └─────────────────────────────────┘
             events retained for days/weeks regardless of consumption</pre>
<ul><li><b>Topic:</b> a named stream. <b>Partition:</b> a shard of it. Events with the same key (e.g. <code>order_id</code>) always go to the same partition, so <b>ordering is guaranteed per key</b>, not globally.</li>
<li><b>Consumer group:</b> a set of consumers sharing the work of one subscriber. Each partition is read by exactly one consumer in the group → parallelism up to the partition count.</li>
<li><b>Offset:</b> each group's bookmark per partition. Reading doesn't delete; a group can reset its offset and replay history — to rebuild a cache, backfill a new service, or recover from a bug.</li>
<li><b>Retention:</b> time- or size-based; the log is the durable record. Compacted topics keep the latest event per key forever.</li></ul>
<pre class="code">producer.send("order.placed", key=order_id, value=event)   # same key → same partition → ordered
consumer = KafkaConsumer("order.placed", group_id="email")
for event in consumer:
    send_email(event)                                      # idempotent: may see the event twice
    consumer.commit()                                      # advance the group's offset</pre>

<h5>When to use which</h5>
<ul><li><b>Pub/sub (SNS, Google Pub/Sub, RabbitMQ fan-out)</b> when several services react to the same event and you don't need replay.</li>
<li><b>Kafka / event stream</b> when you need: replay, per-key ordering, very high throughput, or the log itself as a source of truth (event sourcing, CDC feeds, audit).</li>
<li><b>Plain queue</b> when exactly one worker should do each job and nobody else cares.</li>
<li><b>Not Kafka</b> for a small team with modest volume — it's an operational commitment (brokers, ZooKeeper/KRaft, partitions, rebalances). Managed pub/sub gets you 90% of the way.</li></ul>

<h5>In the wild</h5>
<ul><li><b>LinkedIn</b> built Kafka (2011) because they had dozens of systems each needing the same activity events; a central log replaced a mesh of point-to-point pipes.</li>
<li><b>Uber</b> runs trillions of messages a day through Kafka: every trip event feeds pricing, matching, fraud, analytics and driver payments as independent consumer groups.</li>
<li><b>Netflix</b> uses Kafka as the backbone of its data pipeline; the same viewing event feeds recommendations, A/B analysis and billing without those teams coordinating.</li></ul>

<h5>In the interview</h5>
<p>The fan-out scenario — "video uploaded → transcode, thumbnail, index, notify" — is asking for pub/sub: one event, four consumer groups, in parallel, decoupled. Follow-ups: <i>"Is ordering guaranteed?"</i> (per key/partition, not globally — pick the key so related events stay ordered); <i>"A new service needs all historical events?"</i> (replay from offset 0 — a Kafka-only answer); <i>"Kafka or RabbitMQ?"</i> (replay + ordering + scale → Kafka; routing rules + simpler ops → RabbitMQ).</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Queue: one message, one consumer. Pub/sub: one message, every subscriber. Producer knows nobody.</li><li>Kafka: durable ordered log, partitions by key, consumer groups with their own offsets, replayable.</li><li>Ordering is per partition/key. Choose the key so related events stay together.</li></ul></div>`},

 {t:'Delivery guarantees, idempotent consumers and the outbox',i:'☠️',b:`
<h5>What it is</h5>
<p>A <b>delivery guarantee</b> is the promise about how many times a consumer will see each message: at most once, at least once, or exactly once. The honest version of "exactly once" is "at least once, plus consumers that don't care about duplicates."</p>

<h5>Why it exists</h5>
<p>Between "consumer received message" and "broker recorded the ack" there's a network. If the ack is lost, the broker redelivers — the consumer sees the message twice. If you ack <i>before</i> processing to avoid that, and the consumer crashes, the message is lost. You cannot have both zero loss and zero duplicates over an unreliable network without a lot of machinery. So you pick: loss, or duplicates you can survive.</p>

<h5>How it works</h5>
<pre class="code"># At-most-once:  ack first, then process. Fast. Crash → message gone.
queue.ack(msg); handle(msg)            # metrics, logs, "nice to have" notifications

# At-least-once: process, then ack. Crash → redelivered → handled twice.
handle(msg); queue.ack(msg)            # everything that matters — and handle() must be IDEMPOTENT

# Making handle() idempotent — three patterns
# 1. Natural:      SET status='shipped'          (running twice is harmless)
# 2. Dedup table:  INSERT INTO processed(msg_id) ... ON CONFLICT DO NOTHING; if 0 rows → skip
# 3. Conditional:  UPDATE acct SET bal = bal - 50 WHERE id=? AND last_msg_id < ?</pre>
<p>There's a second, sneakier problem: the <b>dual write</b>. Your handler writes to the database <i>and</i> publishes an event. If the DB commit succeeds and the publish fails (or vice versa), the two are out of sync forever. The fix is the <b>transactional outbox</b>:</p>
<pre class="diag">BEGIN
  UPDATE orders SET status = 'paid' WHERE id = 91
  INSERT INTO outbox (event) VALUES ('order.paid', {id: 91})   ← same transaction
COMMIT
              ▼
   a relay process reads outbox rows and publishes them to the broker,
   marking each as sent (at-least-once, so downstream is idempotent — see above)</pre>
<p>Change Data Capture (Debezium) is the outbox pattern generalised: tail the database's own write-ahead log and turn every committed row change into an event. The database becomes the single source of truth for events too.</p>
<p>Kafka offers "exactly-once semantics" within its own ecosystem (idempotent producers + transactional offsets), which is real and useful for stream processing — but the moment a consumer calls an external system (send an email, charge a card), you're back to at-least-once plus idempotency.</p>

<h5>When to use which</h5>
<ul><li><b>At-least-once + idempotent consumer</b> is the default for anything that matters. Design every handler as if it will run twice, because it will.</li>
<li><b>At-most-once</b> only for data you'd rather lose than duplicate: high-volume telemetry, ephemeral notifications.</li>
<li><b>Outbox / CDC</b> whenever a handler must both update a database and emit an event. If you find yourself writing "save, then publish", stop and use the outbox.</li>
<li><b>Dedup table</b> when the operation isn't naturally idempotent (sending an email, calling a third party). Key it by message ID; TTL it after a day.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Airbnb</b> and <b>Uber</b> both describe the outbox pattern in their payments systems — the ledger write and the "payment completed" event commit together, or not at all.</li>
<li><b>Debezium</b> (Red Hat) is the standard open-source CDC connector; it powers cache invalidation, search indexing and cross-service replication at companies from Shopify to Vimeo.</li>
<li><b>Segment</b> has written about processing customer events at-least-once with a dedup layer keyed on message ID, because their downstream destinations (ad platforms) bill per event.</li></ul>

<h5>In the interview</h5>
<p>When you say "queue", the sharp interviewer asks <i>"exactly-once?"</i> The right answer is a small speech: "No — at-least-once, and every consumer is idempotent: natural where possible, a dedup table keyed by message ID otherwise. And to avoid the dual-write problem I'd write events to an outbox table in the same transaction as the business data and relay from there." That paragraph covers three follow-ups and reads as someone who has debugged this at 2 a.m.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>At-least-once + idempotent consumers is the practical default. Exactly-once is at-least-once plus dedup.</li><li>Make handlers idempotent: natural writes, a dedup table by message ID, or conditional updates.</li><li>Never "save then publish". Use a transactional outbox (or CDC) so the DB write and the event commit together.</li></ul></div>`}],

{id:'resil',title:'Resilience Patterns',icon:'🛡️',intro:'Systems fail. The question interviewers ask is whether a failure stays small or takes down everything around it.',
 lessons:[
 {t:'How failures cascade',i:'🎳',b:`
<h5>What it is</h5>
<p>A <b>cascading failure</b> is when one component's problem spreads to healthy components until the whole system is down. The original fault is usually small — one slow dependency, one bad deploy. The cascade is what turns it into an outage.</p>

<h5>Why it exists</h5>
<p>Services wait on each other. Waiting consumes a resource — a thread, a connection, a goroutine, memory. Those resources are finite. When a dependency slows down, callers accumulate waiting requests until they run out of resources, at which point <i>they</i> stop responding to <i>their</i> callers, who accumulate, and so on up the stack. The system doesn't fail because payments is down; it fails because everything that touches payments is now stuck.</p>

<h5>How it works</h5>
<pre class="diag">t=0    payments DB gets slow: queries take 8 s instead of 8 ms
t=10s  payments service: all 200 threads waiting on the DB. Stops accepting new requests.
t=20s  checkout service: calls payments with a 30 s timeout. Its 200 threads fill up with waiting calls.
t=30s  web tier: calls checkout for the cart badge on EVERY page. Its threads fill up.
t=35s  homepage returns 503. Nobody can browse. The "cause" was one slow database.

t=36s  clients see errors and RETRY. Payments DB now gets 3× the traffic. It gets slower.
       ← this is the retry storm. The fix makes the disease worse.</pre>
<p>Three amplifiers turn a blip into a cascade:</p>
<ul><li><b>Long or missing timeouts.</b> A 30-second timeout means a thread is held hostage for 30 seconds by a dependency that would normally answer in 30 ms. Timeouts should be a small multiple of normal latency, not "something safe".</li>
<li><b>Shared resource pools.</b> One thread pool serving all dependencies means the slow one starves the fast ones. Payments being slow shouldn't stop you rendering the product image.</li>
<li><b>Naive retries.</b> Every caller retrying immediately, in sync, triples load on the thing that's already drowning.</li></ul>
<p>The metric that reveals a cascade early is <b>saturation</b>: thread pool utilisation, connection pool wait time, queue depth. Latency and error rate rise <i>after</i> saturation, once the damage is done.</p>

<h5>Defences (each is its own lesson)</h5>
<ul><li><b>Tight timeouts</b> everywhere, tuned to observed p99 latency. <b>Retries with backoff and jitter</b>, budgeted, only on idempotent calls.</li>
<li><b>Circuit breakers</b>: stop calling a dependency that's clearly down; fail fast and return a fallback.</li>
<li><b>Bulkheads</b>: separate resource pools per dependency so one can't exhaust the others.</li>
<li><b>Load shedding</b>: when saturated, reject some requests deliberately (cheap 503) rather than accept all and serve none.</li>
<li><b>Graceful degradation</b>: the page renders without the recommendations widget rather than not at all.</li></ul>

<h5>In the wild</h5>
<ul><li><b>AWS S3, 2017:</b> a typo in a command removed more capacity than intended from the index subsystem; the restart took hours, and because so many AWS services (and the AWS status page) depended on S3, the cascade reached across the internet.</li>
<li><b>Slack, January 2021:</b> a network degradation caused their web tier to scale up aggressively, which exhausted a provisioning-service quota, which prevented healthy instances from booting — a cascade through the autoscaler itself.</li>
<li><b>Cloudflare, 2019:</b> a single regex in a WAF rule consumed 100% CPU on every edge machine simultaneously — a cascade with no network involved at all, just a shared dependency deployed everywhere at once.</li></ul>

<h5>In the interview</h5>
<p>The question is <i>"Service X goes down — what happens to the rest?"</i> Walk the cascade: X's callers hold threads waiting → their callers wait → the front page dies. Then name the defences in order: short timeouts, a circuit breaker that fails fast with a fallback, bulkheads so X's pool can't starve others, and retries with backoff so you don't storm X while it recovers. The phrase "fail fast, degrade gracefully" summarises the whole philosophy.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Cascades happen because waiting consumes finite resources; slow dependencies exhaust their callers, who exhaust theirs.</li><li>Amplifiers: long timeouts, shared pools, naive retries.</li><li>Watch saturation, not just latency. Fail fast, degrade gracefully.</li></ul></div>`},

 {t:'Timeouts, retries, backoff and jitter',i:'🔄',b:`
<h5>What it is</h5>
<p>A <b>timeout</b> is how long you'll wait before giving up on a call. A <b>retry</b> is trying again after failure. <b>Backoff</b> is waiting longer between each retry; <b>jitter</b> is randomising that wait so that thousands of clients don't retry in lockstep. Together they're the difference between a retry that heals a blip and a retry that causes an outage.</p>

<h5>Why it exists</h5>
<p>Transient failures are constant in distributed systems: a dropped packet, a node mid-restart, a brief GC pause. A single retry fixes most of them. But retries are also load: if a service is failing because it's overloaded, retrying adds load. Without backoff, a thousand clients that failed at the same instant will retry at the same instant — a synchronised wave that hits the recovering service exactly when it's weakest.</p>

<h5>How it works</h5>
<pre class="code">def call_with_retry(fn, max_attempts=3, base=0.1, cap=2.0):
    for attempt in range(max_attempts):
        try:
            return fn(timeout=0.5)                    # timeout tuned to ~p99 of healthy latency
        except (Timeout, ServiceUnavailable) as e:    # retry ONLY transient errors, never 4xx
            if attempt == max_attempts - 1: raise
            sleep = random.uniform(0, min(cap, base * 2 ** attempt))   # "full jitter"
            time.sleep(sleep)

# attempt 0 fails → sleep 0–100 ms
# attempt 1 fails → sleep 0–200 ms
# attempt 2 fails → sleep 0–400 ms ... capped at 2 s</pre>
<ul><li><b>Timeout value:</b> a small multiple of the dependency's healthy p99. If it normally answers in 20 ms, a 500 ms timeout catches real problems without holding threads hostage. "30 seconds" is almost always wrong.</li>
<li><b>Which errors to retry:</b> timeouts, 503, connection resets, 429 (after the Retry-After). Never 400/401/403/404 — the same request will fail the same way.</li>
<li><b>Retry budget:</b> cap retries as a fraction of total traffic (e.g., retries ≤ 10% of requests). When the budget is exhausted, stop retrying. This is the throttle that prevents storms.</li>
<li><b>Idempotency:</b> only retry calls that are safe to repeat. A retried non-idempotent POST is a double charge. (Level 5.)</li>
<li><b>Deadlines, not just timeouts:</b> propagate an end-to-end deadline through the call chain so a downstream call doesn't spend 400 ms of a 500 ms budget the caller has already given up on.</li></ul>

<h5>When to use which</h5>
<ul><li><b>Retry</b> at one layer only. If the client, the gateway and the service all retry 3×, one failure becomes 27 requests.</li>
<li><b>Exponential backoff with full jitter</b> as the default. AWS's analysis showed it beats every other scheme for contended resources.</li>
<li><b>No retries</b> for calls that are already slow or already expensive, and for anything non-idempotent without an idempotency key.</li>
<li><b>Hedged requests</b> (send a second request to another replica if the first hasn't answered by the p95) for read-only, latency-critical paths — Google's trick for taming tail latency.</li></ul>

<h5>In the wild</h5>
<ul><li><b>AWS SDKs</b> implement exponential backoff with jitter by default; their "Exponential Backoff and Jitter" blog post is the standard reference and the source of the "full jitter" formula above.</li>
<li><b>Google's SRE book</b> describes retry budgets (retries capped at 10% of requests) and deadline propagation as standard practice across their RPC layer.</li>
<li><b>Envoy / service meshes</b> let you configure retries, timeouts and budgets per route in one place, precisely so every service doesn't hand-roll a slightly different (and wrong) policy.</li></ul>

<h5>In the interview</h5>
<p>When you say "retry", add the qualifiers in one breath: "with exponential backoff and jitter, a small retry budget, only on transient errors, only for idempotent calls, at one layer." Follow-up: <i>"How do you pick the timeout?"</i> — from the healthy p99, not from a guess. Follow-up: <i>"Why jitter?"</i> — without it, every client that failed together retries together, and the recovering service gets hit by a wave.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Timeouts tuned to healthy p99. Deadlines propagated end to end.</li><li>Retry transient errors only, idempotent calls only, at one layer, with a budget.</li><li>Exponential backoff with full jitter so retries don't synchronise into a storm.</li></ul></div>`},

 {t:'Circuit breakers, bulkheads and graceful degradation',i:'⚡',b:`
<h5>What it is</h5>
<p>A <b>circuit breaker</b> wraps calls to a dependency, watches for failures, and when enough happen it "trips": subsequent calls fail immediately without touching the dependency, until a cooldown passes and a probe succeeds. A <b>bulkhead</b> isolates the resources used for each dependency so one failure can't drain the pool everyone shares. <b>Graceful degradation</b> is what you show the user when a breaker is open: something useful instead of an error.</p>

<h5>Why it exists</h5>
<p>Retries handle blips. But when a dependency is genuinely down for minutes, every attempt — with or without backoff — is a wasted timeout that holds a thread and adds load to the thing trying to recover. At some point the right move is to <i>stop calling it</i>, answer instantly with a fallback, and check back later. That's the breaker. The bulkhead is the insurance for when you didn't put a breaker on something.</p>

<h5>How it works</h5>
<pre class="diag">           failures ≥ threshold
 CLOSED ───────────────────────►  OPEN
 (calls pass,                     (calls fail instantly; fallback returned)
  failures counted)                       │ cooldown elapses
   ▲                                      ▼
   │ probe succeeds              HALF-OPEN
   └───────────────────────────  (one trial call allowed)
                                          │ probe fails → back to OPEN</pre>
<pre class="code">class Breaker:
    def call(self, fn, fallback):
        if self.state == OPEN:
            if now() < self.opened_at + self.cooldown: return fallback()   # fail fast, ~0 ms
            self.state = HALF_OPEN                                         # let one through
        try:
            r = fn(); self.on_success(); return r
        except Exception:
            self.on_failure()                     # sliding-window: e.g. >50% of last 20 calls failed
            if self.failures_exceeded(): self.state = OPEN; self.opened_at = now()
            return fallback()

# Bulkhead: one pool per dependency
pools = { "payments": ThreadPool(20), "recs": ThreadPool(10), "search": ThreadPool(30) }
pools["recs"].submit(get_recommendations)   # recs being slow can only block 10 threads, not 200</pre>
<p>Fallbacks are where the design judgment lives:</p>
<ul><li><b>Cached/stale data:</b> show yesterday's recommendations, the last known price.</li><li><b>A default:</b> "trending now" instead of "for you"; an empty widget; a generic image.</li><li><b>Degraded feature:</b> checkout works but the "estimated delivery date" is blank.</li><li><b>Queue it:</b> accept the request, process it when the dependency returns (only for async-able work).</li><li><b>Honest error, fast:</b> "Payments are temporarily unavailable, try in a minute" — in 5 ms instead of 30 s.</li></ul>

<h5>When to use which</h5>
<ul><li><b>Breaker</b> on every call to a dependency that can be down independently of you: other services, third-party APIs, databases you don't own. Not on local function calls.</li>
<li><b>Bulkhead</b> whenever several dependencies share a resource pool. Size each pool to what that dependency should be allowed to consume.</li>
<li><b>Fallback</b> designed per feature: ask "what's the least-bad thing to show if this is unavailable?" — and answer it before the outage, not during.</li>
<li><b>Tune thresholds</b> on failure <i>rate</i> over a window, not a raw count; a single timeout on a low-traffic dependency shouldn't trip it.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Netflix Hystrix</b> (2012) made breakers and bulkheads mainstream; when the recommendation service is down you see "Popular on Netflix" and never notice. It's since been succeeded by Resilience4j, but the patterns are identical.</li>
<li><b>Amazon's retail page</b> is famously composed of hundreds of independent service calls, each with its own timeout and fallback — a missing "customers also bought" widget is invisible to the shopper.</li>
<li><b>Istio / Envoy</b> implement outlier detection (eject a failing backend from the pool) and per-route circuit breaking in the sidecar, so services get breakers without code changes.</li></ul>

<h5>In the interview</h5>
<p>Say "circuit breaker with a fallback" whenever you draw a call to another service. The follow-ups: <i>"What's the fallback?"</i> — name something specific for that feature; <i>"How does it recover?"</i> — half-open probe after a cooldown; <i>"What if you have no fallback?"</i> — fail fast with a clear error, which is still better than a 30-second hang, and bulkhead it so it can't take others down. The 2026 rubric explicitly rewards saying what the user <i>sees</i> during a failure.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Breaker: closed → open after failure threshold → half-open probe → closed. Fail fast, return a fallback.</li><li>Bulkhead: a pool per dependency so one slow service can't starve the rest.</li><li>Design the fallback per feature before the outage: stale data, a default, a degraded page, or a fast honest error.</li></ul></div>`},

 {t:'Observability, health checks and the 2026 rubric',i:'📈',b:`
<h5>What it is</h5>
<p><b>Observability</b> is being able to answer "what is the system doing, and why?" from the outside: <b>metrics</b> (numbers over time), <b>logs</b> (events with context), and <b>traces</b> (one request's path across services). <b>Health checks</b> are how infrastructure decides whether an instance should receive traffic. <b>SLOs</b> are the targets you've promised and alert on.</p>

<h5>Why it exists</h5>
<p>Every pattern in this level assumes you can <i>see</i> the failure: you can't tune a timeout without latency percentiles, can't size a bulkhead without saturation data, can't know a breaker tripped without a metric. And in 2026 interview rubrics, operational maturity is scored explicitly: a clean architecture that nobody could run is graded as incomplete. Companies got tired of hiring engineers who could draw systems but not operate them.</p>

<h5>How it works</h5>
<p><b>The four golden signals</b> (from Google SRE) — for every service, dashboard these and alert on them:</p>
<ul><li><b>Latency:</b> p50, p95, p99 — never just the average, which hides the tail. The p99 is what your unluckiest 1% of users experience, and at scale that's a lot of users.</li>
<li><b>Traffic:</b> requests per second. Context for everything else.</li>
<li><b>Errors:</b> rate of 5xx, timeouts, breaker trips.</li>
<li><b>Saturation:</b> how full the constrained resource is — CPU, connection pool, queue depth, disk. This one leads; the others lag.</li></ul>
<pre class="code"># Distributed tracing: one request, many services, one ID
GET /checkout   trace_id=7f3a  →  gateway (2 ms)
                                   └─ checkout-svc (140 ms)
                                        ├─ inventory-svc (12 ms)
                                        ├─ payments-svc (118 ms)   ← there's your latency
                                        │    └─ payments-db (110 ms)
                                        └─ pricing-svc (8 ms)
# OpenTelemetry propagates trace_id in headers; each hop records a span. Jaeger/Tempo/Honeycomb render it.

# Health checks: two different questions
GET /healthz   → 200 if the process is alive        (liveness: restart me if this fails)
GET /readyz    → 200 if I can serve traffic          (readiness: DB reachable, cache warm; else pull me from the LB)</pre>
<p><b>Structured logs</b> (JSON with <code>trace_id</code>, <code>user_id</code>, <code>duration_ms</code>) so you can query them, not grep them. <b>SLOs</b>: "99.9% of checkout requests under 500 ms over 30 days" — and an <b>error budget</b> (the 0.1% you're allowed to burn) that decides whether the team ships features or fixes reliability this week.</p>
<p><b>Safe rollouts</b> are part of the same story: deploy to 1% (canary), watch the golden signals, then 10%, then everyone; roll back automatically if error rate rises. Blue-green (two full environments, flip traffic) for instant rollback. Feature flags to turn a feature off without a deploy.</p>

<h5>When to use which</h5>
<ul><li><b>Metrics</b> for alerting and dashboards — cheap, aggregated, always on. <b>Logs</b> for the details of one event. <b>Traces</b> for "where did the time go" across services.</li>
<li><b>Alert on symptoms</b> users feel (error rate, p99 latency, SLO burn rate), not on causes (CPU 80%). Causes page you at 3 a.m. for things that don't matter.</li>
<li><b>Liveness</b> checks should be trivial (process responds). <b>Readiness</b> checks should verify real dependencies — but not so many that one flaky dependency marks every instance unready at once.</li>
<li><b>Canary</b> every deploy that touches the request path. The blast radius of a bad deploy should be 1% of users for 5 minutes, not 100% for an hour.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Google's SRE book</b> defined golden signals, SLOs and error budgets; most of the industry's on-call practice descends from it.</li>
<li><b>Netflix</b> deploys through Spinnaker with automated canary analysis: a new build gets a slice of traffic and is statistically compared to the old one on the golden signals before promotion.</li>
<li><b>Honeycomb and Charity Majors</b> popularised "observability" as distinct from monitoring — the ability to ask new questions of high-cardinality data (per-user, per-request) rather than only watching predefined dashboards.</li>
<li><b>Kubernetes</b> bakes liveness and readiness probes into every pod spec; a readiness failure removes the pod from the Service's endpoints in seconds.</li></ul>

<h5>In the interview</h5>
<p>Spend the last five minutes here, unprompted. A closing paragraph like: "For operations: golden-signal dashboards per service, alerts on p99 latency and error-rate SLO burn, distributed tracing with OpenTelemetry so we can find the slow hop, readiness checks that pull unhealthy instances from the LB, and canary deploys with automatic rollback." That's five sentences and it's the section most candidates skip — which is exactly why it scores.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Four golden signals: latency (percentiles), traffic, errors, saturation. Saturation leads.</li><li>Metrics for alerts, logs for detail, traces for cross-service latency. Alert on symptoms, not causes.</li><li>Liveness vs readiness. Canary deploys with auto-rollback. SLOs and error budgets decide what the team works on.</li></ul></div>`}],
