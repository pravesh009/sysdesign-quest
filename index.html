{id:'arch',title:'Design Challenges',icon:'🏛️',intro:'Boss level. Take a prompt, choose components, defend the tradeoffs. Overengineering loses points just like underengineering.',
 lessons:[
 {t:'The 45-minute framework',i:'🗺️',b:`
<h5>What it is</h5>
<p>A system design interview is 45–60 minutes, open-ended, and graded on judgment rather than a correct answer. The framework is a time-boxed sequence that makes sure you show every dimension the rubric scores — scoping, estimation, structure, depth, trade-offs, operations — without running out of time in the middle.</p>

<h5>Why it exists</h5>
<p>The two ways candidates fail are symmetric. One draws boxes in the first minute and designs the wrong system beautifully. The other explores requirements for twenty minutes and never gets to the hard part. The framework fixes both: it forces a short scoping phase, then a deliberately simple design, then depth where it counts.</p>

<h5>How it works</h5>
<pre class="diag">0–5    REQUIREMENTS   Functional (what it does) and non-functional (scale, latency, consistency,
                      availability). Ask 3–5 questions. Scope out loud: "I'll focus on X and Y;
                      Z is out of scope unless you want it."
5–10   ESTIMATION     DAU → QPS (avg and peak) → storage/year → bandwidth. Read:write ratio.
                      Use the numbers to justify choices later ("at 12k QPS reads we need a cache").
10–15  API            The 3–4 endpoints that matter, with request/response shapes. Pagination.
                      Idempotency on writes.
15–25  HIGH-LEVEL     Client → LB → services → data stores, plus queue/cache/CDN where earned.
                      Simple first. Every box must be justified by a requirement or a number.
25–40  DEEP DIVE      The 2 hardest components. Interviewer often picks. Go three layers down:
                      schema + indexes, sharding key, cache strategy, failure handling.
40–45  WRAP-UP        Bottlenecks, SPOFs, what breaks at 10×, monitoring/rollout/cost. Trade-offs
                      you made and the alternative you rejected.</pre>
<p>Two habits that carry the whole thing:</p>
<ul><li><b>Narrate the trade-off, not just the choice.</b> "I could fan out on write (fast reads, expensive posts) or on read (cheap posts, slow reads); since reads dominate 1000:1, write — except for celebrities, where a post would mean millions of writes." That sentence is worth more than the diagram.</li>
<li><b>Pause after each phase.</b> "That's the high-level design — want me to go deep on the feed generation or the storage?" It lets the interviewer steer and shows you can drive without monologuing.</li></ul>

<h5>When to deviate</h5>
<ul><li><b>The interviewer redirects</b> — follow them. The framework is yours; the interview is theirs.</li>
<li><b>Low-level design prompts</b> ("design a parking lot") skip estimation and go to classes, interfaces and state machines.</li>
<li><b>AI-assisted rounds</b> (Google, Meta 2026 formats) expect you to use the tool for scaffolding and to explain what you asked it and how you validated the output; the phases are the same.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Interview rubrics</b> at large companies (as described by ex-interviewers on interviewing.io and Exponent) score roughly: problem navigation, technical depth, trade-off reasoning, communication, and — new in 2025–26 — operational maturity. The framework maps one phase to each.</li>
<li><b>The "mid-level bar"</b> is a complete end-to-end flow with correct choices and one deep component. Senior adds proactive failure modes and multi-region; staff adds migration and organisational cost.</li></ul>

<h5>In the interview</h5>
<p>Open with the framework itself: "I'll spend a few minutes on requirements and scale, define the API, sketch the high-level design, then go deep wherever you'd like." It signals structure before you've said anything technical, and it buys you the right to ask questions instead of guessing. Keep a visible list of "later" items and actually return to them in the wrap-up.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Requirements → estimation → API → high-level → deep dive → wrap-up, time-boxed.</li><li>Justify every box with a requirement or a number. Narrate the trade-off, not just the choice.</li><li>Pause between phases; let the interviewer steer. Spend the last 5 minutes on operations.</li></ul></div>`},

 {t:'Back-of-envelope estimation',i:'🧮',b:`
<h5>What it is</h5>
<p>Rough arithmetic that turns "a lot of users" into numbers you can design against: requests per second, bytes per day, servers needed. Precision doesn't matter; order of magnitude does. Being off by 2× is fine; being off by 100× means you designed the wrong system.</p>

<h5>Why it exists</h5>
<p>Every architectural choice is a threshold decision. A cache is worth it above some read rate; sharding is worth it above some write rate or data size; a CDN above some bandwidth. Without numbers you're guessing which thresholds you've crossed — and interviewers can tell. Estimation is also how you defend a choice: "12k reads/sec, so a single Postgres would be at its limit — hence the cache."</p>

<h5>How it works</h5>
<pre class="code"># Anchors to memorise
1 day ≈ 86,400 s ≈ 1e5 s      1 million/day ≈ 12/s      peak ≈ 2–3× average
1 KB text page  |  ~200 KB photo  |  ~1 MB/s for 1080p video  |  16 B UUID  |  8 B timestamp

# Capacity anchors (order of magnitude)
one app server         ~1–5k simple QPS
one relational DB      ~1–5k mixed QPS;   read replica adds ~same for reads
one Redis node         ~100k ops/s, ~100s of GB
one Kafka partition    ~10 MB/s
SSD                    ~100k IOPS;  1 TB commodity
network in a DC        ~1 GB/s per box

# Worked example: URL shortener
100M new URLs / month  →  100e6 / 2.6e6 s ≈ 40 writes/s      (trivial)
reads:writes 100:1     →  4,000 reads/s avg, ~10k peak       (needs a cache or replicas)
storage per URL ~500 B →  100e6 × 500 B = 50 GB / month → 3 TB over 5 years  (one big DB, or KV store)
cache the hot 20%      →  ~10 GB in Redis serves ~80–90% of reads

# Worked example: chat
50M DAU × 40 msgs/day  →  2e9 msgs/day ≈ 23k msgs/s avg, ~70k peak
each msg ~200 B        →  400 GB/day → ~150 TB/year  (wide-column, sharded by conversation)
concurrent connections →  say 20% online = 10M WebSockets → at ~100k per gateway box ≈ 100 gateways</pre>
<p>Do the arithmetic out loud, round aggressively (1e5 seconds/day, not 86,400), and immediately say what the number <i>means</i>: "70k messages/sec peak is more than one database leader handles comfortably, so we shard."</p>

<h5>When to estimate (and how much)</h5>
<ul><li><b>Always</b> QPS and storage; those drive database and cache choices.</li>
<li><b>Bandwidth</b> when media is involved (video, images) — it decides whether you need a CDN and how much it costs.</li>
<li><b>Connections</b> for anything real-time (chat, gaming, live updates) — decides how many gateway nodes.</li>
<li><b>Stop</b> once you have the numbers that change a decision. Five minutes, not fifteen.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Jeff Dean's "numbers every programmer should know"</b> (latency of L1 cache through cross-continent round trip) is the origin of the anchor-table habit; the ratios matter more than the absolutes.</li>
<li><b>Twitter's fan-out decision</b> was an estimation result: average user has hundreds of followers (fan-out on write is cheap), a celebrity has tens of millions (fan-out on write is not) — hence the hybrid.</li></ul>

<h5>In the interview</h5>
<p>Two minutes of arithmetic, then a sentence of consequence, for each of QPS, storage and (if relevant) bandwidth. Interviewers don't care whether it's 4k or 6k QPS; they care that you know 5k QPS means "cache" and 500 QPS means "one database is fine". If they give you numbers, use theirs; if they don't, state your assumptions and move on.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>1e5 s/day; 1M/day ≈ 12/s; peak 2–3×. App ~1–5k QPS, DB ~1–5k, Redis ~100k.</li><li>Estimate QPS and storage always; bandwidth for media; connections for real-time.</li><li>Every number ends with a consequence: "…so we need X."</li></ul></div>`},

 {t:'Monolith, microservices and the building blocks',i:'🧱',b:`
<h5>What it is</h5>
<p>A <b>monolith</b> is one deployable unit containing all the code. <b>Microservices</b> split it into independently deployable services, each owning one capability and its own data. The <b>building blocks</b> are the standard components that appear once you have more than one service: API gateway, service discovery, CDN, and the ones from earlier levels (LB, cache, queue).</p>

<h5>Why it exists</h5>
<p>Monoliths get hard when many teams share one codebase and one deploy: a bad change anywhere blocks everyone, one part can't scale separately, and the build takes an hour. Microservices fix those by isolation — and pay for it with network calls where function calls used to be, distributed data, and a lot of infrastructure just to find and observe each other. The right answer depends on team size and scale far more than on technology.</p>

<h5>How it works</h5>
<pre class="diag">MODULAR MONOLITH                          MICROSERVICES
┌──────────────────────────┐              client → CDN (static) → API gateway (auth, limits, routing)
│ users │ orders │ billing │  one deploy                       ├─► users-svc   → users DB
│  (clear module borders)  │  one DB                          ├─► orders-svc  → orders DB ──► queue ──► billing-svc → billing DB
└──────────────────────────┘                                  └─► search-svc  → Elasticsearch
                                          service discovery (Consul/K8s DNS) tells services where each other are
                                          tracing (OpenTelemetry) follows one request across all of them</pre>
<ul><li><b>API gateway:</b> the single entry point — TLS, auth, rate limits, routing, and often aggregation ("backend for frontend": one call from mobile fans out to three services and returns one payload).</li>
<li><b>Service discovery:</b> instances come and go; a registry (Consul, Eureka, Kubernetes Services) maps a service name to live addresses. Heartbeats remove dead ones.</li>
<li><b>CDN:</b> edge caches for static assets and cacheable responses; also absorbs traffic spikes and DDoS before they reach you.</li>
<li><b>Database per service:</b> the rule that makes services independent — and the reason cross-service transactions become sagas (Level 4) and cross-service reads become API calls or event-fed read models.</li>
<li><b>Serverless (Lambda, Cloud Functions):</b> functions that scale to zero; great for bursty, short, stateless work (image resize on upload, webhooks). Cold starts and 15-minute limits make it wrong for long or latency-critical paths.</li></ul>

<h5>When to use which</h5>
<ul><li><b>Modular monolith</b> for a small team (under ~20 engineers) or a new product. Clean module boundaries, one deploy, one database, real transactions. This is the mid-level answer and interviewers know it.</li>
<li><b>Extract a service</b> when one module needs to scale or deploy independently, uses a different language/runtime, or is owned by a team that's blocked by the shared deploy. Extract the one that hurts; don't decompose everything.</li>
<li><b>Microservices from the start</b> only when the organisation already has the platform (gateway, discovery, tracing, CI/CD per service) and the team count to justify it.</li>
<li><b>Event-driven</b> between services when loose coupling matters more than immediate consistency; synchronous calls when the caller needs the answer.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Shopify</b> runs one of the largest Rails monoliths in existence with enforced module boundaries (their "componentization" work) — thousands of engineers, still one deploy, by choice.</li>
<li><b>Amazon</b> decomposed into services around 2002 (the "API mandate") because teams of thousands couldn't share a codebase — organisational scale, not technical scale, drove it.</li>
<li><b>Segment</b> famously went microservices and then back to a monolith in 2018, because 140 services for one small team meant more time on infrastructure than product. The write-up is a good corrective to "microservices = mature".</li></ul>

<h5>In the interview</h5>
<p>Say the boring thing: "I'd start with a modular monolith behind a load balancer, extract services where a requirement demands it — the transcoding pipeline scales differently, so that's a separate worker fleet — and put an API gateway in front once there's more than one service." If asked to draw microservices anyway, include the gateway, service discovery, tracing and a database per service, and mention sagas for cross-service writes. Showing you know the cost is the point.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Modular monolith first; extract services when one part needs to scale, deploy or be owned separately.</li><li>Microservices need a gateway, discovery, tracing and a DB per service — infrastructure, not just code.</li><li>Team size and organisation drive the split more than technology.</li></ul></div>`},

 {t:'Worked example: designing a URL shortener end to end',i:'🔗',b:`
<h5>What it is</h5>
<p>The canonical warm-up problem, walked through the framework at the depth a mid-level interviewer expects. Use it as the template for every other design: same phases, same habits, different components.</p>

<h5>Requirements (minutes 0–5)</h5>
<p><b>Functional:</b> given a long URL, return a short one; given a short one, redirect. Optional: custom aliases, expiry, click analytics. <b>Non-functional:</b> redirects must be fast (they're on the critical path of someone else's page), highly available (a dead shortener breaks every link ever shared), links live for years. Scope: "I'll do shortening and redirect, with expiry; analytics as a stretch."</p>

<h5>Estimation (5–10)</h5>
<pre class="code">100M new URLs/month → ~40 writes/s.  Reads 100:1 → ~4k/s avg, ~10k/s peak.
Storage ~500 B/URL → 50 GB/month → ~3 TB over 5 years.
7-char base62 key → 62^7 ≈ 3.5e12 combinations. Enough for centuries.
→ Writes are trivial. Reads need a cache. Storage fits a single big DB or a KV store.</pre>

<h5>API (10–15)</h5>
<pre class="code">POST /shorten   { "url": "https://…", "expires_at": "…" }   Idempotency-Key: …
  → 201 { "short": "https://sho.rt/aZ3xK9q" }
GET  /aZ3xK9q   → 302 Location: https://…    (302 so clicks hit us — analytics; 301 lets browsers cache and skip us)
DELETE /aZ3xK9q → 204</pre>

<h5>High-level design (15–25)</h5>
<pre class="diag">client ──► DNS ──► load balancer ──► app servers (stateless, N of them)
                                        │ read path:  cache (Redis) → miss → DB
                                        │ write path: generate key → DB → return
                                   ┌────┴────┐
                                 Redis     DB  (urls: key PK, long_url, created_at, expires_at, owner)
                                 (hot keys, TTL)   + read replicas
                       key generation: pre-generated pool of unique keys (a KGS) or
                       a counter → base62 (needs a single sequence / Snowflake-style IDs across servers)</pre>
<p>Every box has a reason: LB because N stateless servers; Redis because 10k reads/s peak with a hot-key distribution; replicas because reads dominate; a key-generation strategy because two app servers must never mint the same key.</p>

<h5>Deep dive (25–40) — the two hard parts</h5>
<p><b>Key generation.</b> Options: (a) hash the URL (MD5 → first 7 chars) — collisions need a check-and-retry, and the same URL gives the same key (a feature or a bug). (b) Auto-increment counter → base62 — simple, sequential (guessable), and a single counter is a bottleneck; fix with ranges handed out per server or a Snowflake-style ID. (c) A Key Generation Service that pre-mints millions of random keys into a table and hands them out — no collisions, no coordination on the hot path; the KGS is a dependency that needs its own HA. Pick (c) or (b)-with-ranges and say why.</p>
<p><b>The read path.</b> Cache-aside with a long TTL (URLs rarely change); LRU eviction; expect ~90% hits so the DB sees ~1k/s. Expired links: store <code>expires_at</code>, check it on read, and a background job purges. Hot key (a viral link)? Fine — it's one Redis GET; if a single node saturates, replicate the key. Use 302 not 301 if you want click counts; write analytics events to a queue so redirects stay fast.</p>

<h5>Wrap-up (40–45)</h5>
<ul><li><b>SPOFs:</b> LB (use managed/redundant), Redis (Sentinel or Cluster), DB (replicas + failover), KGS (run two, each with its own key range).</li>
<li><b>At 10×:</b> reads → more Redis nodes with consistent hashing; storage → shard by key (hash-based, keys are already random so no hotspots).</li>
<li><b>Operations:</b> dashboards on redirect p99 and cache hit rate; alert on hit rate dropping (it means the DB is about to get hit); canary deploys; the redirect path has no third-party dependencies by design.</li>
<li><b>Trade-offs I made:</b> KGS over hashing (no collisions, one more service); 302 over 301 (analytics, slightly slower); cache-aside over write-through (writes are rare; simplicity wins).</li></ul>

<h5>In the interview</h5>
<p>This is roughly what a passing mid-level answer looks like: every phase visited, numbers that drive choices, two components taken three layers deep, trade-offs stated with the rejected alternative, and an operations paragraph. Swap the components and the same shape handles a feed, a chat app or a rate limiter — which is what the design challenges below ask you to do.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Reads dominate → cache + replicas; writes are trivial; storage fits one DB for years.</li><li>Key generation is the hard part: hashing (collisions), counter (coordination), or a pre-minted key service.</li><li>302 for analytics, cache-aside with long TTL, analytics via queue, no third-party calls on the redirect path.</li></ul></div>`}],

function renderMap(){document.getElementById('map').innerHTML=WORLD.map((w,i)=>{const locked=i>=S.unlocked;const done=S.quiz[w.id]&&S.quiz[w.id]>=2;return`<button class="lvlrow ${i===S.cur?'active':''} ${locked?'locked':''} ${done?'done':''}" ${locked?'':`onclick="go(${i})"`}><span class="num">${done?'✓':i+1}</span>${w.icon} ${w.title}<span class="st">${locked?'🔒':done?'':''}</span></button>`}).join('')}
function go(i){stopLabs();S.cur=i;save();renderMap();renderLevel();window.scrollTo(0,0);const bb=document.getElementById('badgesBox');if(bb)bb.open=window.innerWidth>860;const a=document.querySelector('.lvlrow.active');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'center'})}
let labTimers=[];function stopLabs(){labTimers.forEach(clearInterval);labTimers=[]}

function renderLevel(){
  const w=WORLD[S.cur];const idx=S.cur;
  let html=`<div class="hero"><span class="kicker">LEVEL ${idx+1} OF ${WORLD.length}</span><h1>${w.icon} ${w.title}</h1><p>${w.intro}</p></div>`;
  html+=`<div class="section-title">📖 LESSONS · read each to the end</div>`;
  w.lessons.forEach((L,li)=>{const k=w.id+li;const got=S.read[k];html+=`<div class="lesson open" id="L${k}"><button class="lesson-h" onclick="document.getElementById('L${k}').classList.toggle('open')"><span class="ico">${L.i}</span><h4>${L.t}</h4><span class="xp ${got?'got':''}">${got?'✓ read':'+10 XP at the end'}</span><span class="chev">▶</span></button><div class="lesson-b">${L.b}<button class="btn ${got?'btn-o':'btn-m'} btn-sm gotit" id="G${k}" onclick="gotIt('${k}')" ${got?'disabled':''}>${got?'✓ Read':'✓ Got it · +10 XP'}</button></div></div>`});
  html+=`<div class="section-title">🧪 LAB · 40 XP</div><div id="lab"></div>`;
  html+=`<div class="section-title">👾 BOSS QUIZ · 20 XP per correct</div>`;
  html+=`<div class="boss"><h4>👾 Pass 2 of 3 to unlock the next level</h4>`;
  w.quiz.forEach((q,qi)=>{html+=`<div class="q"><p>${qi+1}. ${q.q}</p><div class="opts">${q.o.map((o,oi)=>`<button class="opt" onclick="ans(this,${qi},${oi})">${o}</button>`).join('')}</div><div class="why" id="why${qi}">${q.w}</div></div>`});
  html+=`<div class="result" id="qres"></div></div>`;
  html+=`<div class="navb"><button class="btn btn-o" ${idx===0?'disabled':''} onclick="go(${idx-1})">← Previous level</button><button class="btn btn-p" id="nextBtn" ${idx+1>=S.unlocked||idx===WORLD.length-1?'disabled':''} onclick="go(${idx+1})">Next level →</button></div>`;
  document.getElementById('main').innerHTML=html;
  quizState={answered:0,correct:0};
  LABS[w.lab]();
}
function gotIt(k){if(S.read[k])return;S.read[k]=true;save();const el=document.getElementById('L'+k);const x=el.querySelector('.xp');x.textContent='✓ read';x.classList.add('got');const g=document.getElementById('G'+k);g.textContent='✓ Read';g.disabled=true;g.classList.replace('btn-m','btn-o');addXP(10,'Lesson read');const total=WORLD.reduce((a,w)=>a+w.lessons.length,0);if(Object.keys(S.read).length>=total)award('scholar')}

let quizState={answered:0,correct:0};
function ans(btn,qi,oi){const w=WORLD[S.cur];const q=w.quiz[qi];const opts=btn.parentElement.querySelectorAll('.opt');opts.forEach((o,i)=>{o.disabled=true;if(i===q.a)o.classList.add('ok')});if(oi!==q.a)btn.classList.add('no');else{quizState.correct++;const qk=w.id+'q'+qi;if(!S.qdone)S.qdone={};if(!S.qdone[qk]){S.qdone[qk]=true;save();addXP(20,'Correct answer')}}document.getElementById('why'+qi).classList.add('show');quizState.answered++;
  if(quizState.answered===w.quiz.length){const r=document.getElementById('qres');r.classList.add('show');const c=quizState.correct;if(!S.quiz[w.id]||c>S.quiz[w.id]){S.quiz[w.id]=c;save()}
    if(c>=2){r.innerHTML=`🎉 Boss defeated — ${c}/3. ${S.cur<WORLD.length-1?'Next level unlocked.':'You finished the quest!'}`;r.style.color='var(--mint)';if(S.unlocked<S.cur+2){S.unlocked=S.cur+2;save()}award('first');if(c===3)award('perfect');const nb=document.getElementById('nextBtn');if(nb&&S.cur<WORLD.length-1)nb.disabled=false;renderMap();confetti(60);if(WORLD.every(x=>S.quiz[x.id]>=2))award('done')}
    else{r.innerHTML=`${c}/3 — re-read the lessons, then <button class="btn btn-o btn-sm" onclick="renderLevel()">retry the boss</button>`;r.style.color='var(--coral)'}}}
function labDone(id){const w=WORLD[S.cur];if(S.labs[w.id])return;S.labs[w.id]=true;save();addXP(40,'Lab completed')}

const LABS={};
function labShell(title,goal,inner){document.getElementById('lab').innerHTML=`<div class="lab"><div class="lab-h"><span class="tag">HANDS-ON</span><h4>${title}</h4></div><div class="goal">🎯 ${goal}</div>${inner}</div>`}

/* --- Load balancer --- */
LABS.lb=function(){
  labShell('Load Balancer Simulator','Send traffic, switch algorithms, kill a server. Notice which algorithm keeps servers even when requests vary in cost.',`
  <div class="ctrls"><label>Algorithm <select id="lbAlgo"><option value="rr">Round robin</option><option value="lc">Least connections</option><option value="rand">Random</option><option value="w">Weighted (S1 = 3×)</option></select></label>
  <label><input type="checkbox" id="lbVar"> Variable request cost</label>
  <button class="btn btn-p btn-sm" onclick="lbSend(1)">Send 1</button><button class="btn btn-p btn-sm" onclick="lbSend(10)">Send 10 🌊</button><button class="btn btn-o btn-sm" onclick="lbReset()">Reset</button></div>
  <div class="stage" id="lbStage"><div class="lbnode"><span>⚖️ Load balancer</span></div><div class="servers" id="lbSrv"></div></div>
  <div class="stats"><div class="stat"><div class="v" id="lbTot">0</div><div class="l">requests routed</div></div><div class="stat"><div class="v" id="lbHot">0</div><div class="l">overload events</div></div><div class="stat"><div class="v" id="lbDrop">0</div><div class="l">sent to dead server</div></div></div>
  <div class="insight" id="lbIns"><b>Try this:</b> tick "variable cost", send 10 with round robin, then reset and try least connections. Then kill a server and watch health checks route around it.</div>`);
  lb={srv:[{load:0,alive:true},{load:0,alive:true},{load:0,alive:true},{load:0,alive:true}],rr:0,tot:0,hot:0,drop:0};lbDraw();
  labTimers.push(setInterval(()=>{lb.srv.forEach(s=>{s.load=Math.max(0,s.load-1)});lbDraw(false)},350));
};
let lb;
function lbDraw(hot){const el=document.getElementById('lbSrv');if(!el)return;el.innerHTML=lb.srv.map((s,i)=>{const h=Math.min(100,s.load*10);const col=h>80?'var(--coral)':h>50?'var(--amber)':'var(--mint)';return`<div class="srv ${s.alive?'':'dead'} ${s.load>=9&&s.alive?'hot':''}" id="srv${i}"><button class="kill" onclick="lbKill(${i})">${s.alive?'✕ kill':'↻ revive'}</button><div class="nm">Server ${i+1}${i===0?' (big)':''}</div><div class="bar"><div style="height:${h}%;background:${col}"></div></div><div class="cnt">${s.load} active</div></div>`}).join('');document.getElementById('lbTot').textContent=lb.tot;document.getElementById('lbHot').textContent=lb.hot;document.getElementById('lbDrop').textContent=lb.drop}
function lbKill(i){lb.srv[i].alive=!lb.srv[i].alive;lb.srv[i].load=0;lbDraw()}
function lbReset(){lb.srv.forEach(s=>{s.load=0;s.alive=true});lb.tot=lb.hot=lb.drop=0;lb.rr=0;lbDraw()}
function lbSend(n){const algo=document.getElementById('lbAlgo').value;const vari=document.getElementById('lbVar').checked;for(let k=0;k<n;k++){setTimeout(()=>{const alive=lb.srv.map((s,i)=>i).filter(i=>lb.srv[i].alive);if(!alive.length){lb.drop++;lbDraw();return}let i;
  if(algo==='rr'){i=alive[lb.rr%alive.length];lb.rr++}
  else if(algo==='lc'){i=alive.reduce((a,b)=>lb.srv[a].load<=lb.srv[b].load?a:b)}
  else if(algo==='rand'){i=alive[Math.floor(Math.random()*alive.length)]}
  else{const pool=alive.flatMap(x=>x===0?[0,0,0]:[x]);i=pool[Math.floor(Math.random()*pool.length)]}
  const cost=vari?(Math.random()<.25?4:1):1;lb.srv[i].load+=cost;lb.tot++;if(lb.srv[i].load>=9)lb.hot++;lbDraw();lbDot(i);
  if(lb.tot>=40)award('lb');if(lb.tot>=25)labDone('lb');
  const ins=document.getElementById('lbIns');if(lb.hot>3&&algo==='rr')ins.innerHTML='<b>Notice:</b> round robin doesn\'t know Server 3 is drowning — it just keeps counting. Switch to <b>least connections</b>.';else if(algo==='lc'&&lb.tot>15)ins.innerHTML='<b>Notice:</b> least connections spreads load by <i>actual busyness</i>. This is why it\'s the default for APIs with mixed request costs.';else if(lb.drop>0)ins.innerHTML='<b>Notice:</b> without health checks, traffic goes to a corpse. Real LBs ping servers every few seconds and pull dead ones from rotation.';
  },k*120)}}
function lbDot(i){const st=document.getElementById('lbStage'),tg=document.getElementById('srv'+i);if(!st||!tg)return;const d=document.createElement('div');d.className='dot';const sr=st.getBoundingClientRect(),tr=tg.getBoundingClientRect();d.style.left=(sr.width/2-6)+'px';d.style.top='36px';st.appendChild(d);requestAnimationFrame(()=>{d.style.transform=`translate(${tr.left-sr.left+tr.width/2-sr.width/2}px,${tr.top-sr.top-36+10}px)`});setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),200)},500)}

/* --- LRU cache --- */
LABS.cache=function(){
  labShell('LRU Cache Simulator','Capacity is 4. Click keys to look them up. Watch hits, misses, evictions, and how much time you save vs hitting the DB every time.',`
  <div class="ctrls"><span style="font-size:.82rem;color:var(--ink-2)">Look up key:</span><div class="keys">${'ABCDEFG'.split('').map(k=>`<button class="keybtn" onclick="cacheGet('${k}')">${k}</button>`).join('')}</div><button class="btn btn-o btn-sm" onclick="LABS.cache()">Reset</button></div>
  <div class="stage"><div style="font-size:.75rem;color:var(--ink-3);margin-bottom:6px">← most recently used · least recently used →</div><div class="cacherow" id="slots"></div><div class="log" id="clog">Click a key to start.</div></div>
  <div class="stats"><div class="stat"><div class="v" id="cHit">0%</div><div class="l">hit rate</div></div><div class="stat"><div class="v" id="cN">0</div><div class="l">lookups</div></div><div class="stat"><div class="v" id="cT">0 ms</div><div class="l">total latency</div></div><div class="stat"><div class="v" id="cS">0 ms</div><div class="l">saved vs no cache</div></div></div>
  <div class="insight" id="cIns"><b>Try this:</b> press A B C D A B C D — everything fits, all hits after warm-up. Now press A B C D E — E evicts the least recently used key. Which one? Then press it again.</div>`);
  cache={items:[],hits:0,n:0,t:0};cacheDraw();
};
let cache;
function cacheDraw(fx,key){const el=document.getElementById('slots');if(!el)return;el.innerHTML=[0,1,2,3].map(i=>{const k=cache.items[i];if(!k)return`<div class="slot empty">empty</div>`;return`<div class="slot ${fx&&k===key?fx:''}">${k}</div>`}).join('');document.getElementById('cHit').textContent=cache.n?Math.round(cache.hits/cache.n*100)+'%':'0%';document.getElementById('cN').textContent=cache.n;document.getElementById('cT').textContent=cache.t+' ms';document.getElementById('cS').textContent=(cache.n*10-cache.t)+' ms'}
function cacheGet(k){cache.n++;const log=document.getElementById('clog');const i=cache.items.indexOf(k);let ev='';
  if(i>-1){cache.hits++;cache.t+=1;cache.items.splice(i,1);cache.items.unshift(k);log.innerHTML=`<span class="h">HIT</span>  ${k} → served from cache in 1 ms<br>`+log.innerHTML;cacheDraw('hit',k)}
  else{cache.t+=10;if(cache.items.length>=4){ev=cache.items.pop();const sl=document.querySelectorAll('.slot')[3];if(sl)sl.classList.add('evict')}cache.items.unshift(k);log.innerHTML=`<span class="m">MISS</span> ${k} → DB read 10 ms${ev?`, evicted <b>${ev}</b>`:''}<br>`+log.innerHTML;setTimeout(()=>cacheDraw('miss',k),ev?150:0)}
  if(cache.n>=8)labDone('cache');if(cache.n>=15&&cache.hits/cache.n>=.7)award('cache');
  const ins=document.getElementById('cIns');if(ev)ins.innerHTML=`<b>Evicted ${ev}</b> — it was the one nobody had touched longest. That's LRU. If ${ev} is actually popular, you just created a miss. LFU (least <i>frequently</i> used) would have kept it.`;else if(cache.n>10&&cache.hits/cache.n>.7)ins.innerHTML=`<b>${Math.round(cache.hits/cache.n*100)}% hit rate.</b> Your DB only sees ${cache.n-cache.hits} of ${cache.n} reads. Scale that to Facebook and it's the difference between 1,000 database servers and 100,000.`;}

/* --- Consistent hash ring --- */
LABS.ring=function(){
  labShell('Consistent Hash Ring','Add and remove nodes. Compare how many keys move with consistent hashing vs plain modulo. Fewer moves = fewer cache misses during scaling.',`
  <div class="ctrls"><button class="btn btn-p btn-sm" onclick="ringAdd()">+ Add node</button><button class="btn btn-c btn-sm" onclick="ringRemove()">− Remove node</button><label><input type="checkbox" id="vnodes" onchange="ringDraw()"> Virtual nodes (3 per server)</label></div>
  <div class="stage"><div class="ringwrap"><div class="ring"><svg viewBox="0 0 300 300" id="ringSvg"></svg></div><div><div class="nodelist" id="nodeList"></div><div class="cmp" id="cmp"></div></div></div></div>
  <div class="insight" id="rIns"><b>Try this:</b> add a node. With modulo (<code>hash % N</code>) almost every key changes owner. With the ring, only the keys between the new node and its neighbor move.</div>`);
  ring={nodes:['N1','N2','N3'],keys:Array.from({length:24},(_,i)=>'k'+i)};ringDraw();
};
let ring;const COLS=['#1E5EFF','#FF5E5B','#19C37D','#FFB020','#7A5AF8','#0EA5E9','#EC4899','#84CC16'];
function h360(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return((h>>>0)%3600)/10}
function ringPos(){const v=document.getElementById('vnodes')?.checked;const pts=[];ring.nodes.forEach((n,i)=>{const reps=v?3:1;for(let r=0;r<reps;r++)pts.push({node:n,i,deg:h360(n+(r?'#'+r:''))})});return pts.sort((a,b)=>a.deg-b.deg)}
function ringOwner(kdeg,pts){for(const p of pts)if(p.deg>=kdeg)return p;return pts[0]}
function ringAssign(nodes,vn){const save=ring.nodes;ring.nodes=nodes;const pts=(function(){const p=[];nodes.forEach((n,i)=>{for(let r=0;r<(vn?3:1);r++)p.push({node:n,i,deg:h360(n+(r?'#'+r:''))})});return p.sort((a,b)=>a.deg-b.deg)})();ring.nodes=save;const m={};ring.keys.forEach(k=>m[k]=ringOwner(h360(k),pts).node);return m}
function modAssign(nodes){const m={};ring.keys.forEach(k=>m[k]=nodes[Math.floor(h360(k)*10)%nodes.length]);return m}
function ringDraw(prevNodes){const vn=document.getElementById('vnodes').checked;const pts=ringPos();const svg=document.getElementById('ringSvg');let s=`<circle cx="150" cy="150" r="110" fill="none" stroke="var(--line)" stroke-width="6"/>`;
  ring.keys.forEach(k=>{const d=h360(k),o=ringOwner(d,pts);const a=(d-90)*Math.PI/180;s+=`<circle cx="${150+110*Math.cos(a)}" cy="${150+110*Math.sin(a)}" r="4" fill="${COLS[o.i%8]}" opacity=".85"/>`});
  pts.forEach(p=>{const a=(p.deg-90)*Math.PI/180;s+=`<g><circle cx="${150+110*Math.cos(a)}" cy="${150+110*Math.sin(a)}" r="11" fill="${COLS[p.i%8]}" stroke="var(--card)" stroke-width="3"/><text x="${150+110*Math.cos(a)}" y="${150+110*Math.sin(a)+4}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="Space Grotesk">${p.node.slice(1)}</text></g>`});
  svg.innerHTML=s;const cur=ringAssign(ring.nodes,vn);const cnt={};ring.keys.forEach(k=>cnt[cur[k]]=(cnt[cur[k]]||0)+1);document.getElementById('nodeList').innerHTML=ring.nodes.map((n,i)=>`<div><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${COLS[i%8]};margin-right:6px"></span>${n}</span><b>${cnt[n]||0} keys</b></div>`).join('');
  const cmp=document.getElementById('cmp');if(prevNodes){const pr=ringAssign(prevNodes,vn),pm=modAssign(prevNodes),cm=modAssign(ring.nodes);let mr=0,mm=0;ring.keys.forEach(k=>{if(pr[k]!==cur[k])mr++;if(pm[k]!==cm[k])mm++});cmp.innerHTML=`<div style="font-weight:700;margin-bottom:4px">Keys that moved (of ${ring.keys.length})</div><div class="row"><span>Modulo <code>hash % N</code></span><span class="bad">${mm} moved</span></div><div class="row"><span>Consistent hashing</span><span class="good">${mr} moved</span></div>`;document.getElementById('rIns').innerHTML=`<b>${mm} vs ${mr}.</b> Every moved key is a cache miss (or a data migration). Modulo remaps ~${Math.round(mm/ring.keys.length*100)}% of keys; the ring remaps ~${Math.round(mr/ring.keys.length*100)}%. ${vn?'Virtual nodes are also spreading load more evenly — check the key counts.':'Now tick <b>virtual nodes</b> and notice the key counts get more even.'}`;labDone('ring')}else cmp.innerHTML='<div style="color:var(--ink-3)">Add or remove a node to compare.</div>';if(ring.nodes.length>=6)award('ring')}
function ringAdd(){if(ring.nodes.length>=8)return;const prev=[...ring.nodes];ring.nodes.push('N'+(ring.nodes.length+1));ringDraw(prev)}
function ringRemove(){if(ring.nodes.length<=1)return;const prev=[...ring.nodes];ring.nodes.pop();ringDraw(prev)}

/* --- CAP --- */
LABS.cap=function(){
  labShell('CAP Playground','Two replicas of a bank balance. Cut the network, write to one side, then read from the other under CP vs AP rules.',`
  <div class="ctrls"><label>Mode <select id="capMode" onchange="capDraw()"><option value="AP">AP — always answer</option><option value="CP">CP — never lie</option></select></label><button class="btn btn-o btn-sm" id="capCut" onclick="capCut()">✂️ Cut the network</button><button class="btn btn-p btn-sm" onclick="capWrite()">Write: deposit $50 to Node A</button></div>
  <div class="stage"><div class="capstage"><div class="node"><div style="font-weight:600">Node A (leader)</div><div class="val" id="vA">$100</div><div class="st" id="sA">healthy</div><button class="btn btn-o btn-sm" onclick="capRead('A')" style="margin-top:6px">Read from A</button></div><div class="link" id="capLink" data-l="replication"></div><div class="node"><div style="font-weight:600">Node B (replica)</div><div class="val" id="vB">$100</div><div class="st" id="sB">in sync</div><button class="btn btn-o btn-sm" onclick="capRead('B')" style="margin-top:6px">Read from B</button></div></div><div class="log" id="capLog" style="height:70px">Cut the network, then write, then read from B.</div></div>
  <div class="insight" id="capIns"><b>What to notice:</b> in AP mode Node B keeps answering with a <i>stale</i> $100 during the partition. In CP mode Node B refuses to answer rather than risk being wrong. Neither is "correct" — it depends on whether this is a bank balance or a like count.</div>`);
  cap={a:100,b:100,cut:false,readsA:0,readsB:0};capDraw();
};
let cap;
function capLog(m,c){const l=document.getElementById('capLog');l.innerHTML=`<span class="${c||''}">${m}</span><br>`+l.innerHTML}
function capDraw(){const mode=document.getElementById('capMode').value;document.getElementById('vA').textContent='$'+cap.a;const vb=document.getElementById('vB');vb.className='val';if(cap.cut){document.getElementById('capLink').classList.add('cut');document.getElementById('capCut').textContent='🔧 Heal the network';if(mode==='CP'){vb.textContent='UNAVAILABLE';vb.classList.add('blocked');document.getElementById('sB').textContent='refusing reads (might be stale)'}else{vb.textContent='$'+cap.b;if(cap.b!==cap.a)vb.classList.add('stale');document.getElementById('sB').textContent=cap.b!==cap.a?'⚠️ stale — can\'t sync':'cut off, serving last known'}}else{document.getElementById('capLink').classList.remove('cut');document.getElementById('capCut').textContent='✂️ Cut the network';vb.textContent='$'+cap.b;document.getElementById('sB').textContent='in sync'}}
function capCut(){cap.cut=!cap.cut;if(!cap.cut){cap.b=cap.a;capLog('Network healed. Replica caught up → $'+cap.b,'h')}else capLog('Network partition! A and B can\'t talk.','m');capDraw()}
function capWrite(){const mode=document.getElementById('capMode').value;if(cap.cut&&mode==='CP'){capLog('CP: write REJECTED — can\'t reach a quorum, refusing to accept a write that might be lost.','m');document.getElementById('sA').textContent='write rejected';setTimeout(()=>document.getElementById('sA').textContent='healthy',1200);return}cap.a+=50;if(!cap.cut)cap.b=cap.a;capLog(`Wrote $50 to A → A=$${cap.a}${cap.cut?' (B still $'+cap.b+', can\'t replicate)':', replicated to B'}`,'h');capDraw()}
function capRead(n){const mode=document.getElementById('capMode').value;if(n==='A'){cap.readsA++;capLog('Read A → $'+cap.a,'h')}else{cap.readsB++;if(cap.cut&&mode==='CP')capLog('Read B → 503 Unavailable (CP refuses possibly-stale data)','m');else if(cap.cut&&cap.b!==cap.a)capLog(`Read B → $${cap.b} — STALE by $${cap.a-cap.b}. AP answered, but wrong.`,'m');else capLog('Read B → $'+cap.b,'h')}if(cap.readsA&&cap.readsB&&cap.cut){award('cap');labDone('cap')}}

/* --- Token bucket --- */
LABS.bucket=function(){
  labShell('Token Bucket Rate Limiter','Bucket holds 10 tokens, refills 2/sec. Each request takes one. Spam the button and watch what gets rejected.',`
  <div class="ctrls"><button class="btn btn-p btn-sm" onclick="bkReq(1)">Send request</button><button class="btn btn-c btn-sm" onclick="bkReq(15)">Burst 15 🌊</button><label>Refill rate <input type="range" id="bkRate" min="1" max="6" value="2" oninput="document.getElementById('bkRateV').textContent=this.value"> <span id="bkRateV">2</span>/s</label><button class="btn btn-o btn-sm" onclick="LABS.bucket()">Reset</button></div>
  <div class="stage"><div class="bucketwrap"><div><div class="bucket"><div class="cap">cap 10</div><div class="water" id="bkWater"></div></div><div style="text-align:center;font-family:'Space Grotesk';font-weight:700;margin-top:6px" id="bkTok">10 tokens</div></div><div><div style="font-size:.78rem;color:var(--ink-3);margin-bottom:6px">Recent requests</div><div class="reqlog" id="bkLog"></div></div></div></div>
  <div class="stats"><div class="stat"><div class="v" id="bkOk">0</div><div class="l">accepted (200)</div></div><div class="stat"><div class="v" id="bkNo">0</div><div class="l">rejected (429)</div></div></div>
  <div class="insight" id="bkIns"><b>Try this:</b> hit Burst 15. The first 10 pass (the bucket allows bursts), the last 5 get a 429. Wait a few seconds — tokens refill — try again. That's why token bucket beats a fixed window: bursts are allowed, sustained abuse isn't.</div>`);
  bk={t:10,ok:0,no:0};bkDraw();labTimers.push(setInterval(()=>{const r=+document.getElementById('bkRate').value;bk.t=Math.min(10,bk.t+r/4);bkDraw()},250));
};
let bk;
function bkDraw(){document.getElementById('bkWater').style.height=(bk.t/10*100)+'%';document.getElementById('bkTok').textContent=Math.floor(bk.t)+' tokens';document.getElementById('bkOk').textContent=bk.ok;document.getElementById('bkNo').textContent=bk.no}
function bkReq(n){for(let i=0;i<n;i++){setTimeout(()=>{const log=document.getElementById('bkLog');if(!log||!bk)return;const s=document.createElement('span');if(bk.t>=1){bk.t-=1;bk.ok++;s.className='ok';s.textContent='✓'}else{bk.no++;s.className='no';s.textContent='✕'}log.prepend(s);while(log.children.length>40)log.lastChild.remove();bkDraw();if(bk.no>=5){award('bucket');labDone('bucket')}if(bk.no>0)document.getElementById('bkIns').innerHTML='<b>429 Too Many Requests.</b> A good API returns a <code>Retry-After</code> header here. Try raising the refill rate — that\'s the knob you\'d turn for a premium-tier customer.'},i*60)}}

/* --- Queue --- */
LABS.queue=function(){
  labShell('Message Queue Simulator','Producers add work; consumers drain it. Trigger a traffic spike and see how adding consumers (not bigger servers) fixes the backlog.',`
  <div class="ctrls"><button class="btn btn-p btn-sm" onclick="qAdd(1)">Produce 1</button><button class="btn btn-c btn-sm" onclick="qAdd(30)">Traffic spike +30 🌊</button><label>Consumers <input type="range" id="qCons" min="1" max="6" value="1" oninput="qConsDraw()"> <span id="qConsV">1</span></label><button class="btn btn-o btn-sm" onclick="LABS.queue()">Reset</button></div>
  <div class="stage"><div class="qstage"><div class="qbox"><div class="t">producer</div><div class="n">📤</div></div><div><div class="qlane" id="qLane"></div><div class="consumers" id="qConsRow"></div></div><div class="qbox"><div class="t">processed</div><div class="n" id="qDone">0</div></div></div><div class="qhist" id="qHist"></div><div style="font-size:.72rem;color:var(--ink-3);text-align:center">queue depth over time</div></div>
  <div class="stats"><div class="stat"><div class="v" id="qDepth">0</div><div class="l">in queue</div></div><div class="stat"><div class="v" id="qMax">0</div><div class="l">peak depth</div></div><div class="stat"><div class="v" id="qLag">0s</div><div class="l">oldest message age</div></div></div>
  <div class="insight" id="qIns"><b>Try this:</b> spike +30 with one consumer. Watch the backlog and the age of the oldest message climb. Now slide consumers to 4. The queue absorbed the spike — nobody got a 500 — and horizontal scaling of <i>workers</i> drained it.</div>`);
  q={items:[],done:0,max:0,hist:[],cleared:false};qConsDraw();labTimers.push(setInterval(qTick,500));
};
let q;
function qConsDraw(){const n=+document.getElementById('qCons').value;document.getElementById('qConsV').textContent=n;document.getElementById('qConsRow').innerHTML=Array.from({length:n},()=>`<div class="cons">⚙</div>`).join('');qDraw()}
function qAdd(n){const now=Date.now();for(let i=0;i<n;i++)q.items.push(now);q.max=Math.max(q.max,q.items.length);if(n>=30)q.spiked=true;qDraw()}
function qTick(){const n=+document.getElementById('qCons').value;for(let i=0;i<n;i++)if(q.items.length){q.items.shift();q.done++}q.hist.push(q.items.length);if(q.hist.length>40)q.hist.shift();if(q.spiked&&q.items.length===0&&!q.cleared){q.cleared=true;award('queue');labDone('queue')}qDraw()}
function qDraw(){const lane=document.getElementById('qLane');if(!lane)return;const now=Date.now();lane.innerHTML=q.items.slice(0,40).map(t=>`<div class="msg ${now-t>4000?'old':''}"></div>`).join('')+(q.items.length>40?`<span style="font-size:.7rem;color:var(--ink-3)">+${q.items.length-40}</span>`:'');document.getElementById('qDone').textContent=q.done;document.getElementById('qDepth').textContent=q.items.length;document.getElementById('qMax').textContent=q.max;document.getElementById('qLag').textContent=q.items.length?Math.round((now-q.items[0])/1000)+'s':'0s';const n=+document.getElementById('qCons').value;document.querySelectorAll('.cons').forEach((c,i)=>c.classList.toggle('busy',i<q.items.length));const mx=Math.max(1,...q.hist);document.getElementById('qHist').innerHTML=q.hist.map(v=>`<div style="height:${v/mx*100}%"></div>`).join('')}

/* --- Circuit breaker --- */
LABS.breaker=function(){
  labShell('Circuit Breaker','Call a flaky downstream. Break it, watch the breaker trip after 3 failures, then fix it and watch the half-open probe recover.',`
  <div class="ctrls"><button class="btn btn-p btn-sm" onclick="cbCall()">Call payment service</button><button class="btn btn-p btn-sm" onclick="for(let i=0;i<6;i++)setTimeout(cbCall,i*150)">Call ×6</button><button class="btn btn-c btn-sm" id="cbToggle" onclick="cbToggle()">💥 Break the downstream</button><button class="btn btn-o btn-sm" onclick="LABS.breaker()">Reset</button></div>
  <div class="stage"><div class="states"><div class="stbox closed" id="stClosed">CLOSED · calls pass</div><div class="stbox open" id="stOpen">OPEN · fail fast</div><div class="stbox half" id="stHalf">HALF-OPEN · probing</div></div><div style="font-size:.78rem;color:var(--ink-3);margin-bottom:4px">Calls (newest first)</div><div class="calls" id="cbCalls"></div><div class="log" id="cbLog" style="height:64px"></div></div>
  <div class="stats"><div class="stat"><div class="v" id="cbFails">0</div><div class="l">consecutive failures</div></div><div class="stat"><div class="v" id="cbSaved">0 s</div><div class="l">timeout time avoided</div></div><div class="stat"><div class="v" id="cbCool">—</div><div class="l">cooldown</div></div></div>
  <div class="insight" id="cbIns"><b>Try this:</b> break the downstream, then Call ×6. Calls 1–3 wait a full timeout (slow!). Call 4 onward fails in 1 ms — the breaker is OPEN. Fix the downstream, wait for the cooldown, call again: one probe goes through, succeeds, breaker closes.</div>`);
  cb={state:'closed',fails:0,down:false,saved:0,cool:0,tripped:false};cbDraw();labTimers.push(setInterval(()=>{if(cb.state==='open'){cb.cool--;if(cb.cool<=0){cb.state='half';cbLog('Cooldown over → HALF-OPEN. Next call is a probe.')}cbDraw()}},1000));
};
let cb;
function cbLog(m){const l=document.getElementById('cbLog');l.innerHTML=m+'<br>'+l.innerHTML}
function cbDraw(){['closed','open','half'].forEach(s=>document.getElementById('st'+s[0].toUpperCase()+s.slice(1)).classList.toggle('on',cb.state===s));document.getElementById('cbFails').textContent=cb.fails;document.getElementById('cbSaved').textContent=cb.saved+' s';document.getElementById('cbCool').textContent=cb.state==='open'?cb.cool+'s':'—';document.getElementById('cbToggle').textContent=cb.down?'🔧 Fix the downstream':'💥 Break the downstream'}
function cbToggle(){cb.down=!cb.down;cbLog(cb.down?'Downstream is now failing.':'Downstream is healthy again.');cbDraw()}
function cbPush(cls,txt){const c=document.getElementById('cbCalls');if(!c)return;const s=document.createElement('span');s.className=cls;s.textContent=txt;c.prepend(s);while(c.children.length>14)c.lastChild.remove()}
function cbCall(){if(!cb||!document.getElementById('cbCalls'))return;if(cb.state==='open'){cb.saved+=5;cbPush('fast','fast-fail 1ms');cbLog('OPEN → returned fallback instantly (saved a 5 s timeout).');cbDraw();return}
  if(cb.down){cb.fails++;cbPush('fail','timeout 5s');if(cb.state==='half'){cb.state='open';cb.cool=5;cbLog('Probe failed → back to OPEN for 5 s.')}else if(cb.fails>=3){cb.state='open';cb.cool=5;cb.tripped=true;cbLog('3 consecutive failures → breaker OPEN for 5 s.');document.getElementById('cbIns').innerHTML='<b>Tripped.</b> Every call now returns a fallback in ~1 ms instead of hanging 5 s. Threads are free, the page still renders (degraded), and the sick service gets breathing room. Now fix the downstream and wait.'}else cbLog(`Failure ${cb.fails}/3 — waited full 5 s timeout.`)}
  else{cbPush('ok','200 · 40ms');if(cb.state==='half'){cb.state='closed';cbLog('Probe succeeded → CLOSED. Normal traffic resumes.');if(cb.tripped){award('breaker');labDone('breaker')}}cb.fails=0}cbDraw()}

/* --- Design challenge --- */
const CHALLENGES=[
 {t:'URL shortener',p:'100M new URLs/month, 10k redirects/sec, redirects must be fast, links live 5 years.',need:['lb','app','cache','kv'],bad:['ws','graph','kafka'],why:{cache:'Redirects are 100:1 read-heavy — a cache in front serves almost everything.',kv:'A key→URL lookup is the whole workload. A key-value store (or a simple SQL table with an index) is enough.',lb:'Multiple stateless app servers need a front door.',app:'Someone has to generate keys and serve redirects.',ws:'Nothing is real-time. WebSockets add nothing.',graph:'There are no relationships to traverse.',kafka:'No async fan-out is required for the core path. (Analytics later, maybe.)'}},
 {t:'Chat app (WhatsApp-lite)',p:'50M DAU, 1:1 and group chat, messages delivered in <1 s, history must persist.',need:['lb','app','ws','wide','queue'],bad:['cdn','graph'],why:{ws:'Sub-second push to the recipient needs a persistent connection.',wide:'Billions of append-only messages queried by conversation → wide-column (Cassandra) or sharded SQL by chat_id.',queue:'Offline recipients need messages buffered; fan-out to group members should be async.',lb:'Front door for connection servers.',app:'Chat/session servers.',cdn:'Text messages aren\'t static assets. (Media attachments would use one — but not the core.)',graph:'Contacts are a simple list; no graph traversal needed.'}},
 {t:'News feed',p:'Users follow others; the feed shows recent posts from followees. Reads ≫ writes. Some accounts have 50M followers.',need:['lb','app','cache','sql','queue'],bad:['ws','wide'],why:{queue:'Fan-out on write is done asynchronously by workers after a post is saved.',cache:'Precomputed feeds live in Redis lists per user — that\'s what makes reads fast.',sql:'Posts and the follow graph fit relational storage with sharding by user_id.',lb:'Front door.',app:'Post service + feed service.',ws:'Feeds are pull-on-open; push isn\'t required for the core.',wide:'Overkill here unless you\'re at Twitter scale; SQL + cache is the mid-level answer.'}}
];
const PALETTE=[['lb','⚖️ Load balancer'],['app','🖥️ App servers'],['cache','⚡ Cache (Redis)'],['cdn','🌍 CDN'],['sql','🗄️ SQL DB'],['kv','🔑 Key-value DB'],['wide','📚 Wide-column DB'],['graph','🕸️ Graph DB'],['queue','📬 Message queue'],['kafka','📡 Kafka stream'],['ws','🔌 WebSockets'],['search','🔍 Search index']];
LABS.design=function(){
  design={i:0,sel:new Set(),passed:S.designPassed||{}};designDraw();
};
let design;
function designDraw(){const c=CHALLENGES[design.i];labShell('Design Challenge '+(design.i+1)+' of '+CHALLENGES.length+' — '+c.t,c.p,`
  <div style="font-size:.85rem;color:var(--ink-2)">Pick the components you'd put in the first high-level design. Nothing extra, nothing missing.</div>
  <div class="palette">${PALETTE.map(([id,l])=>`<button class="chip ${design.sel.has(id)?'sel':''}" onclick="designToggle('${id}')">${l}</button>`).join('')}</div>
  <div class="ctrls"><button class="btn btn-p" onclick="designCheck()">Check my design</button><button class="btn btn-o btn-sm" onclick="designNext()">Next challenge →</button></div>
  <div class="verdict" id="verdict"></div>`)}
function designToggle(id){design.sel.has(id)?design.sel.delete(id):design.sel.add(id);designDraw()}
function designCheck(){const c=CHALLENGES[design.i];const missing=c.need.filter(x=>!design.sel.has(x));const extra=c.bad.filter(x=>design.sel.has(x));const v=document.getElementById('verdict');v.classList.add('show');const name=id=>PALETTE.find(p=>p[0]===id)[1];
  if(!missing.length&&!extra.length){v.className='verdict show pass';v.innerHTML=`<b>✅ Solid design.</b> That's what a mid-level interviewer wants on the whiteboard at minute 15.<ul>${c.need.map(x=>`<li><b>${name(x)}</b> — ${c.why[x]}</li>`).join('')}</ul>`;if(!design.passed[design.i]){design.passed[design.i]=true;S.designPassed=design.passed;save();addXP(30,'Design challenge passed');if(Object.keys(design.passed).length===CHALLENGES.length){award('arch');labDone('design')}}}
  else{v.className='verdict show fail';v.innerHTML=`<b>Not quite.</b>${missing.length?`<div style="margin-top:6px"><b>Missing:</b><ul>${missing.map(x=>`<li><b>${name(x)}</b> — ${c.why[x]}</li>`).join('')}</ul></div>`:''}${extra.length?`<div style="margin-top:6px"><b>Overengineered:</b><ul>${extra.map(x=>`<li><b>${name(x)}</b> — ${c.why[x]}</li>`).join('')}</ul></div>`:''}`}}
function designNext(){design.i=(design.i+1)%CHALLENGES.length;design.sel=new Set();designDraw()}
