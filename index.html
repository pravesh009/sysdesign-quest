<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SysDesign Quest — learn system design by playing</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3FA;--grid:rgba(30,94,255,.08);--card:#FFFFFF;--ink:#10233F;--ink-2:#4A5B75;--ink-3:#8A98AE;--line:#D5DEEC;
  --blue:#1E5EFF;--blue-soft:#E4ECFF;--coral:#FF5E5B;--coral-soft:#FFE6E5;--mint:#19C37D;--mint-soft:#DDF7EB;--amber:#FFB020;--amber-soft:#FFF1D6;--violet:#7A5AF8;--violet-soft:#ECE7FF;
  --r:12px;--shadow:0 2px 0 var(--line);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#0E1626;--grid:rgba(120,160,255,.07);--card:#172136;--ink:#EAF0FA;--ink-2:#A9B6CC;--ink-3:#6F7E98;--line:#25324B;
  --blue:#5B8CFF;--blue-soft:#1C2B4D;--coral:#FF7A78;--coral-soft:#3A2022;--mint:#3DD68C;--mint-soft:#143528;--amber:#FFC24D;--amber-soft:#3A2E12;--violet:#9B86FF;--violet-soft:#2A2350;
}}
:root[data-theme=dark]{
  --paper:#0E1626;--grid:rgba(120,160,255,.07);--card:#172136;--ink:#EAF0FA;--ink-2:#A9B6CC;--ink-3:#6F7E98;--line:#25324B;
  --blue:#5B8CFF;--blue-soft:#1C2B4D;--coral:#FF7A78;--coral-soft:#3A2022;--mint:#3DD68C;--mint-soft:#143528;--amber:#FFC24D;--amber-soft:#3A2E12;--violet:#9B86FF;--violet-soft:#2A2350;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;line-height:1.6}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em;line-height:1.2}
code,.mono{font-family:'IBM Plex Mono',monospace;font-size:.9em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Layout ===== */
.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:2px solid var(--line);padding:0 16px;height:60px;display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
@media (max-width:640px){.xptext,.streak{display:none}.brand span.txt{display:none}}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.brand .logo{width:28px;height:28px;border-radius:7px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:.9rem}
.xpwrap{flex:1;min-width:200px;display:flex;align-items:center;gap:10px}
.lvl{font-family:'Space Grotesk';font-weight:700;font-size:.85rem;background:var(--blue-soft);color:var(--blue);padding:4px 10px;border-radius:99px;white-space:nowrap}
.xpbar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xptext{font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.streak{font-size:.82rem;background:var(--amber-soft);color:#8a5a00;padding:4px 10px;border-radius:99px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .streak{color:var(--amber)}}
.iconbtn{width:36px;height:36px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:1rem}
.iconbtn:hover{border-color:var(--blue)}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1200px;margin:0 auto;gap:24px;padding:24px 20px 80px;align-items:start}
.side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto;overscroll-behavior:contain;z-index:1;scrollbar-width:thin}
/* phone / narrow: compact horizontal level strip instead of a tall sidebar */
@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:14px;padding:14px 12px 80px}
  .side{position:sticky;top:60px;max-height:none;overflow:hidden;min-width:0;background:var(--paper);padding:8px 0 4px;margin:0 -12px;padding-left:12px;padding-right:12px;z-index:40}
  .map{padding:6px;min-width:0}.map h3{display:none}
  #map{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
  #map::-webkit-scrollbar{display:none}
  #map .lvlrow{flex:0 0 auto;width:auto;padding:6px 10px;font-size:.8rem;border-radius:99px;border:2px solid var(--line);background:var(--card);white-space:nowrap}
  #map .lvlrow.active{border-color:var(--blue)}
  #map .lvlrow .num{width:20px;height:20px;font-size:.68rem}
  #map .lvlrow .st{margin-left:4px}
  .badges{margin-top:8px}.badges summary{cursor:pointer;font-size:.78rem;color:var(--ink-3);font-weight:700;padding:2px 8px;list-style:none}
  .badges:not([open]) .badgegrid{display:none}
  .badgegrid{grid-template-columns:repeat(6,1fr)}
}
.map{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px}
.map h3{font-size:.8rem;color:var(--ink-3);padding:4px 8px 8px;font-weight:700}
.lvlrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:.88rem;font-weight:500;color:var(--ink-2);width:100%;text-align:left;position:relative}
.lvlrow:hover{background:var(--paper)}
.lvlrow.active{background:var(--blue-soft);color:var(--blue)}
.lvlrow.locked{opacity:.55}
.lvlrow .num{width:26px;height:26px;border-radius:7px;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:.75rem;flex-shrink:0}
.lvlrow.done .num{background:var(--mint);border-color:var(--mint);color:#fff}
.lvlrow.active .num{border-color:var(--blue)}
.lvlrow .st{margin-left:auto;font-size:.75rem}
.badges{margin-top:14px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px}
.badgegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 8px}
.badge{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:1.25rem;background:var(--paper);border:2px dashed var(--line);filter:grayscale(1);opacity:.4;position:relative}
.badge.on{filter:none;opacity:1;border:2px solid var(--amber);background:var(--amber-soft)}
.badge:hover::after{content:attr(data-tip);position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:.7rem;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5}

.main{min-width:0;overflow-x:hidden}
.stage,.lab,.lesson-b{max-width:100%}
.servers{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.capstage{grid-template-columns:1fr auto 1fr}@media (max-width:520px){.capstage{grid-template-columns:1fr}.link{width:100%;height:6px}.bucketwrap{grid-template-columns:1fr}.qstage{grid-template-columns:1fr}}
.hero{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:28px;margin-bottom:20px;position:relative;overflow:hidden}
.hero h1{font-size:2rem;margin-bottom:8px}
.hero p{color:var(--ink-2);max-width:560px}
.kicker{display:inline-block;font-size:.75rem;font-weight:600;color:var(--blue);background:var(--blue-soft);padding:3px 9px;border-radius:6px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:9px;font-weight:600;font-size:.9rem;border:2px solid transparent;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 3px 0 #1443c7}
.btn-p:hover{filter:brightness(1.05)}
.btn-o{border-color:var(--line);background:var(--card);color:var(--ink)}
.btn-o:hover{border-color:var(--blue);color:var(--blue)}
.btn-m{background:var(--mint);color:#fff;box-shadow:0 3px 0 #0f8f5a}
.btn-c{background:var(--coral);color:#fff;box-shadow:0 3px 0 #c93b39}
.btn-sm{padding:6px 12px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* ===== Lesson cards ===== */
.section-title{font-size:.8rem;color:var(--ink-3);font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::after{content:"";flex:1;height:2px;background:var(--line)}
.lesson{background:var(--card);border:2px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.lesson-h{padding:14px 18px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.lesson-h:hover{background:var(--paper)}
.lesson-h .ico{width:34px;height:34px;border-radius:9px;background:var(--blue-soft);display:grid;place-items:center;font-size:1.05rem;flex-shrink:0}
.lesson-h h4{font-size:1rem;flex:1}
.lesson-h .xp{font-size:.72rem;font-weight:700;color:var(--violet);background:var(--violet-soft);padding:2px 8px;border-radius:99px}
.lesson-h .xp.got{color:var(--mint);background:var(--mint-soft)}
.lesson-h .chev{color:var(--ink-3);transition:transform .2s}
.lesson.open .chev{transform:rotate(90deg)}
.lesson-b{display:none;padding:4px 18px 18px;border-top:2px solid var(--line);font-size:.93rem}
.lesson.open .lesson-b{display:block}
.lesson-b p{margin:10px 0}
.lesson-b h5{font-family:'Space Grotesk';font-size:.95rem;margin:22px 0 6px;padding-left:12px;border-left:4px solid var(--blue);line-height:1.3}
.lesson-b h5:first-child{margin-top:14px}
.lesson-b pre{font-family:'IBM Plex Mono';font-size:.78rem;line-height:1.5;background:var(--paper);border:2px solid var(--line);border-radius:9px;padding:12px 14px;overflow-x:auto;margin:10px 0;white-space:pre}
.lesson-b pre.diag{color:var(--ink-2)}
.takeaways{margin-top:18px;background:var(--mint-soft);border:2px solid var(--mint);border-radius:10px;padding:12px 16px}
.takeaways ul{margin:6px 0 0}
.gotit{margin-top:14px}
.lesson-h .xp.got{color:var(--mint);background:var(--mint-soft)}
.lesson-b ul{padding-left:20px;margin:6px 0}
.lesson-b li{margin:4px 0}
.callout{border-left:4px solid var(--blue);background:var(--blue-soft);padding:10px 14px;border-radius:0 9px 9px 0;margin:12px 0;font-size:.9rem}
.callout.real{border-color:var(--mint);background:var(--mint-soft)}
.callout.ask{border-color:var(--amber);background:var(--amber-soft)}
.callout b{font-weight:600}
.flip{margin:10px 0;border:2px dashed var(--line);border-radius:9px;padding:10px 14px}
.flip summary{cursor:pointer;font-weight:600;font-size:.9rem;list-style:none;display:flex;gap:8px;align-items:center}
.flip summary::before{content:"🎤";font-size:.85rem}
.flip[open] summary{margin-bottom:8px}
.flip p{color:var(--ink-2)}

/* ===== Lab ===== */
.lab{background:var(--card);border:2px solid var(--blue);border-radius:var(--r);padding:20px;margin-bottom:12px}
.lab-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lab-h h4{font-size:1.05rem}
.lab-h .tag{font-size:.7rem;background:var(--blue);color:#fff;padding:2px 8px;border-radius:99px;font-weight:700}
.lab .goal{font-size:.88rem;color:var(--ink-2);margin-bottom:14px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.ctrls select,.ctrls input[type=range]{font-family:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:.85rem}
.ctrls label{font-size:.82rem;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.stage{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:16px;position:relative;min-height:150px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:9px;padding:8px 12px;min-width:110px}
.stat .v{font-family:'Space Grotesk';font-weight:700;font-size:1.25rem}
.stat .l{font-size:.72rem;color:var(--ink-3)}
.insight{margin-top:12px;font-size:.88rem;color:var(--ink-2);border-top:2px dashed var(--line);padding-top:10px}
.insight b{color:var(--ink)}

/* Load balancer */
.servers{display:grid;gap:12px}
.srv{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px;text-align:center;position:relative;transition:border-color .2s}
.srv.dead{opacity:.45;border-style:dashed}
.srv.hot{border-color:var(--coral);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.srv .nm{font-weight:600;font-size:.85rem}
.srv .bar{height:60px;background:var(--line);border-radius:6px;margin:8px 0;position:relative;overflow:hidden}
.srv .bar>div{position:absolute;bottom:0;left:0;right:0;background:var(--mint);transition:height .3s,background .3s}
.srv .cnt{font-family:'IBM Plex Mono';font-size:.75rem;color:var(--ink-2)}
.srv .kill{position:absolute;top:4px;right:4px;font-size:.7rem;color:var(--ink-3)}
.lbnode{text-align:center;margin-bottom:12px}
.lbnode span{display:inline-block;background:var(--blue);color:#fff;padding:6px 14px;border-radius:8px;font-weight:600;font-size:.85rem}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--blue);pointer-events:none;transition:transform .5s cubic-bezier(.3,.7,.4,1),opacity .2s}

/* Cache */
.cacherow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.slot{width:64px;height:64px;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:1.3rem;background:var(--card);transition:all .3s}
.slot.empty{border-style:dashed;color:var(--ink-3);font-size:.7rem;font-weight:500}
.slot.hit{border-color:var(--mint);background:var(--mint-soft);transform:scale(1.08)}
.slot.miss{border-color:var(--coral);background:var(--coral-soft)}
.slot.evict{animation:pop .4s}
@keyframes pop{50%{transform:scale(.6);opacity:.3}}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keybtn{width:40px;height:40px;border-radius:8px;border:2px solid var(--line);background:var(--card);font-family:'Space Grotesk';font-weight:700}
.keybtn:hover{border-color:var(--blue);color:var(--blue)}
.log{font-family:'IBM Plex Mono';font-size:.75rem;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px;height:88px;overflow:auto;margin-top:10px;color:var(--ink-2)}
.log .h{color:var(--mint)}.log .m{color:var(--coral)}

/* Ring */
.ringwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
@media (max-width:600px){.ringwrap{grid-template-columns:1fr}}
.ring svg{width:100%;max-width:300px;display:block;margin:0 auto}
.nodelist{font-size:.83rem}
.nodelist div{display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px;margin-bottom:4px;background:var(--card);border:2px solid var(--line)}
.cmp{margin-top:10px;background:var(--card);border:2px solid var(--line);border-radius:9px;padding:10px;font-size:.85rem}
.cmp .row{display:flex;justify-content:space-between;padding:3px 0}
.cmp .bad{color:var(--coral);font-weight:700}.cmp .good{color:var(--mint);font-weight:700}

/* CAP */
.capstage{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.node{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.node .val{font-family:'Space Grotesk';font-size:1.6rem;font-weight:700;margin:6px 0}
.node .val.stale{color:var(--amber)}
.node .val.blocked{color:var(--coral);font-size:1rem}
.node .st{font-size:.75rem;color:var(--ink-3)}
.link{width:80px;height:6px;background:var(--mint);border-radius:99px;position:relative;transition:background .3s}
.link.cut{background:repeating-linear-gradient(90deg,var(--coral) 0 8px,transparent 8px 16px)}
.link::after{content:attr(data-l);position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--ink-3);white-space:nowrap}
.readq{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}

/* Bucket */
.bucketwrap{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.bucket{width:100px;height:130px;border:3px solid var(--ink-2);border-top:none;border-radius:0 0 14px 14px;position:relative;margin:0 auto;overflow:hidden;background:var(--card)}
.bucket .water{position:absolute;bottom:0;left:0;right:0;background:var(--blue);transition:height .25s}
.bucket .cap{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--ink-3)}
.reqlog{display:flex;flex-wrap:wrap;gap:4px;min-height:60px}
.reqlog span{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:.6rem;color:#fff;font-weight:700}
.reqlog .ok{background:var(--mint)}.reqlog .no{background:var(--coral)}

/* Queue */
.qstage{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.qbox{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px;text-align:center;min-width:90px}
.qbox .t{font-size:.75rem;color:var(--ink-3)}
.qbox .n{font-family:'Space Grotesk';font-size:1.5rem;font-weight:700}
.qlane{height:56px;border:2px solid var(--line);border-radius:10px;background:var(--card);display:flex;align-items:center;padding:6px;gap:4px;overflow:hidden}
.msg{width:14px;height:36px;border-radius:4px;background:var(--violet);flex-shrink:0}
.msg.old{background:var(--coral)}
.qhist{height:60px;display:flex;align-items:flex-end;gap:2px;margin-top:10px}
.qhist div{flex:1;background:var(--violet);border-radius:2px 2px 0 0;min-height:2px}
.consumers{display:flex;gap:6px;justify-content:center;margin-top:6px}
.cons{width:28px;height:28px;border-radius:7px;background:var(--mint);display:grid;place-items:center;color:#fff;font-size:.8rem}
.cons.busy{animation:pulse .6s infinite}
@keyframes pulse{50%{opacity:.5}}

/* Breaker */
.states{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stbox{padding:10px 16px;border-radius:9px;border:2px solid var(--line);font-weight:700;font-family:'Space Grotesk';font-size:.85rem;color:var(--ink-3);background:var(--card)}
.stbox.on.closed{border-color:var(--mint);color:var(--mint);background:var(--mint-soft)}
.stbox.on.open{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
.stbox.on.half{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.calls{display:flex;gap:4px;flex-wrap:wrap;min-height:26px}
.calls span{padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:600;color:#fff}
.calls .ok{background:var(--mint)}.calls .fail{background:var(--coral)}.calls .fast{background:var(--ink-3)}

/* Design challenge */
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:8px 12px;border-radius:9px;border:2px solid var(--line);background:var(--card);font-size:.85rem;font-weight:500;display:flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--blue)}
.chip.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.verdict{margin-top:12px;padding:12px 14px;border-radius:9px;font-size:.9rem;display:none}
.verdict.show{display:block}
.verdict ul{padding-left:18px;margin-top:6px}
.verdict.pass{background:var(--mint-soft);border:2px solid var(--mint)}
.verdict.fail{background:var(--amber-soft);border:2px solid var(--amber)}

/* Quiz */
.boss{background:var(--card);border:2px solid var(--violet);border-radius:var(--r);padding:20px;margin-top:12px}
.boss h4{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.q{margin-bottom:16px}
.q p{font-weight:600;font-size:.93rem;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{padding:10px 14px;border:2px solid var(--line);border-radius:9px;background:var(--card);text-align:left;font-size:.88rem;width:100%}
.opt:hover{border-color:var(--violet)}
.opt.ok{border-color:var(--mint);background:var(--mint-soft)}
.opt.no{border-color:var(--coral);background:var(--coral-soft)}
.opt:disabled{cursor:default}
.why{display:none;font-size:.85rem;color:var(--ink-2);margin-top:8px;padding:8px 12px;background:var(--paper);border-radius:8px}
.why.show{display:block}
.result{margin-top:12px;font-weight:600;display:none}
.result.show{display:block}

{id:'scale',title:'Scaling Basics',icon:'📈',intro:'Every system design interview starts here. If you can explain how a single server becomes a fleet, you can explain everything that follows.',
 lessons:[
 {t:'What "scalable" actually means',i:'📏',b:`
<h5>What it is</h5>
<p>A system is <b>scalable</b> if it can handle more load by adding resources, roughly in proportion, without a redesign. "Load" is not one number — it comes in three flavours that fail differently:</p>
<ul><li><b>Traffic:</b> requests per second (QPS). Saturates CPU and connections.</li>
<li><b>Data:</b> rows, files, bytes. Saturates disk and makes queries slow.</li>
<li><b>Connections:</b> concurrent users holding sockets open (chat, streaming). Saturates memory and file descriptors.</li></ul>
<p>Scalability is not the same as performance. A fast system that falls over at 2× traffic is performant, not scalable. A scalable system may be slower at 1× but keeps working at 100×.</p>

<h5>Why it exists</h5>
<p>Every system starts the same way — app, database and files on one machine. This is the right starting point, and it is also a time bomb. As traffic grows:</p>
<pre class="diag">1×    CPU 30%   p99 latency 80 ms    fine
3×    CPU 85%   p99 latency 400 ms   requests start queueing
5×    CPU 100%  p99 latency 6 s      timeouts, retries make it worse
      disk full / OOM / any crash → 100% outage (single point of failure)</pre>
<p>The dangerous part is the middle row. Latency doesn't grow linearly with load — it stays flat, then goes vertical once a resource hits ~80% utilisation, because requests begin waiting in line for it. By the time you notice, you are already in the third row.</p>

<h5>How it works</h5>
<p>Scaling is a loop, not a one-time decision: <b>measure → find the bottleneck → remove it → repeat.</b> The bottleneck is whichever resource saturates first, and it moves every time you fix one.</p>
<p>The first step is always estimation. You cannot pick the right fix without a rough number:</p>
<pre class="code">1,000,000 daily users × 10 requests each  = 10,000,000 req/day
10,000,000 / 86,400 s                     ≈ 115 QPS average
peak ≈ 3× average                          ≈ 350 QPS

one tuned app server (stateless, simple work) ≈ 1,000–5,000 QPS
one relational DB (mixed read/write queries)   ≈ 500–3,000 QPS
one Redis node                                 ≈ 100,000 ops/s</pre>
<p>Read those numbers against each other and the story writes itself: at 350 QPS one app server is fine, and the database is the thing that will hurt first. That is why nearly every scaling story begins with "protect the database" — read replicas, then a cache — before anyone adds a second app server.</p>

<h5>When to scale (and when not to)</h5>
<ul><li><b>Do</b> scale when metrics tell you: p99 latency climbing, CPU sustained above ~70%, DB connection-pool waits, queue depth growing.</li>
<li><b>Don't</b> scale on a guess. Premature sharding or microservices costs months and rarely gets used. Stack Overflow serves ~1.3 billion page views a month on nine web servers and two SQL servers.</li>
<li><b>Do</b> design so scaling is <i>possible</i> later: stateless app tier, externalised sessions, no hard-coded hostnames. Those are cheap on day one and brutal to retrofit.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Instagram, 2010:</b> launched on one server. Hit 25,000 users in a day and it fell over. Their first fix was not clever: move the DB to its own box, put two app servers behind a load balancer. That bought them a year.</li>
<li><b>Twitter, 2008–2010:</b> the "fail whale" era. A Rails monolith with a single MySQL database could not keep up with tweet volume. The fix took years — a custom timeline service, sharded storage, and eventually a rewrite of the serving path in the JVM.</li>
<li><b>Stack Overflow, today:</b> the counter-example. Deliberately few, very large servers, obsessive query tuning, heavy caching. Proof that "scale" doesn't have to mean "thousands of machines".</li></ul>

<h5>In the interview</h5>
<p>This topic shows up as a follow-up, not a question: <i>"Great — now traffic goes up 10×. What breaks first?"</i> The weak answer is "add more servers". The strong answer names the bottleneck order with numbers: <b>database first</b> (add replicas and a cache), <b>then app tier</b> (scale out behind the LB), <b>then the network edge</b> (CDN, multiple LBs). Saying "I'd check p99 latency and DB connection waits before deciding" tells them you have operated a real system.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Scalability = handling more load by adding resources, without redesign. Three kinds of load: traffic, data, connections.</li><li>Latency stays flat then goes vertical near ~80% utilisation. Measure before it turns.</li><li>The database is almost always the first bottleneck. Protect it before scaling the app tier.</li></ul></div>`},

 {t:'Vertical vs horizontal scaling',i:'↕️',b:`
<h5>What it is</h5>
<p><b>Vertical scaling (scale up):</b> replace the machine with a bigger one — more CPU, RAM, faster disk. The architecture doesn't change; the box does.</p>
<p><b>Horizontal scaling (scale out):</b> add more machines that do the same job, and spread the work across them. The architecture changes: something now has to distribute requests and the machines must be interchangeable.</p>

<h5>Why it exists</h5>
<p>Vertical scaling is the obvious move and it works — until three walls appear:</p>
<ul><li><b>A ceiling.</b> The largest instance a cloud sells (hundreds of cores, tens of TB of RAM) is still one machine. Past it, there is no bigger button.</li>
<li><b>Non-linear cost.</b> Doubling the box roughly doubles the price; going from 64 to 128 cores often costs far more than 2× because those parts are rare.</li>
<li><b>Still one machine.</b> A giant server that dies takes 100% of your traffic with it. Vertical scaling buys capacity, not availability.</li></ul>
<p>Horizontal scaling removes all three — and introduces one new problem, which is the subject of the next lesson: the machines have to be able to stand in for each other.</p>

<h5>How it works</h5>
<pre class="diag">VERTICAL                        HORIZONTAL
                                          ┌─ app server 1 ─┐
 client ──► [ one big app+db ]   client ──►│ load balancer  │──► app server 2
                                          └────────────────┘──► app server 3
                                                                    │
                                                              [ shared DB ]
                                                              [ shared Redis ]</pre>
<p>Capacity in the horizontal model is simple arithmetic, and that simplicity is the whole appeal:</p>
<pre class="code">capacity_qps   = servers × qps_per_server
servers_needed = ceil(peak_qps × safety_margin / qps_per_server)

# 350 QPS peak, 2× headroom, ~1,000 QPS per server
servers_needed = ceil(350 × 2 / 1000) = 1  → run 2 anyway, for availability</pre>
<p>Notice the last line. Even when the maths says one server is enough, you run at least two, because horizontal scaling's real gift is that any one machine can disappear — for a crash, a deploy, a kernel patch — and nobody notices.</p>
<p>The prerequisites for scaling out are the things people forget: a load balancer in front, sessions and files moved <i>off</i> the app servers into a shared store, one database everyone talks to, and automated deploys (you will not SSH into 40 boxes).</p>

<h5>When to use which</h5>
<ul><li><b>Start vertical.</b> It is the cheapest engineering time you will ever spend. A single well-sized box with good indexes goes a very long way.</li>
<li><b>Go horizontal for the app tier</b> as soon as you need availability — which is usually the moment real customers depend on you. Two small servers beat one big one.</li>
<li><b>Keep databases vertical longer.</b> Writes need a single source of truth. Scale the DB up, add read replicas for reads, and only shard (horizontal writes) when the biggest box genuinely can't keep up. Most companies never get there.</li>
<li><b>Use horizontal when load is bursty.</b> Autoscaling — adding servers at 9 a.m. and removing them at midnight — is only possible if adding a server is routine.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Netflix:</b> the horizontal extreme. Thousands of identical stateless instances per service, autoscaled by time of day (evening traffic is several times morning traffic), and Chaos Monkey randomly killing instances in production to prove that losing one is a non-event.</li>
<li><b>Stack Overflow:</b> the vertical extreme. Two very large SQL Server machines (one active, one standby), each with hundreds of GB of RAM so the working set lives in memory. They scaled up instead of out because a relational schema with heavy joins is painful to shard.</li>
<li><b>PostgreSQL vs Cassandra:</b> the same split in database design. Postgres is built to scale up (one primary, replicas for reads). Cassandra is built to scale out (every node accepts writes, add nodes to add capacity) — and pays for it with weaker consistency.</li></ul>

<h5>In the interview</h5>
<p>The follow-up is almost always: <i>"Why not just scale out the database the way you scaled the app servers?"</i> The answer: app servers are stateless so they are interchangeable; a database holds the truth, and two machines both accepting writes to the same row have to agree — which is either slow (consensus) or wrong (conflicts). So you scale the DB up first, split reads onto replicas, and treat sharding as a last resort. Mentioning that ordering — <b>up → replicas → cache → shard</b> — is a mid-level signal.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Vertical = bigger box: simple, has a ceiling, still a single point of failure.</li><li>Horizontal = more boxes: needs a load balancer and interchangeable servers, but gives availability and elasticity.</li><li>App tier: scale out early. Database: scale up first, replicas next, shard last.</li></ul></div>`},

 {t:'Stateless vs stateful: the rule that makes scaling out work',i:'🧳',b:`
<h5>What it is</h5>
<p>A service is <b>stateless</b> if any instance can handle any request without remembering anything from previous requests. Everything it needs arrives in the request or lives in a shared store.</p>
<p>A service is <b>stateful</b> if it keeps something in local memory or disk between requests — a login session, an upload in progress, an open WebSocket, a local cache that matters.</p>

<h5>Why it exists</h5>
<p>Horizontal scaling assumes servers are interchangeable. State breaks that assumption in a very specific way:</p>
<pre class="diag">1. User logs in. Load balancer sends them to server 2.
2. Server 2 stores  sessions["abc123"] = {user: 42}  in its own RAM.
3. Next request. Load balancer sends them to server 3.
4. Server 3 looks up "abc123" → not found → user is logged out.
5. Deploy server 2 → every session it held is gone.</pre>
<p>Every symptom of a stateful app tier looks like a mystery bug: users randomly logged out, "my upload disappeared", counters that are wrong on some refreshes. The cause is always the same — the state lived on one machine and the request landed on another.</p>

<h5>How it works</h5>
<p>The fix is to <b>externalise state</b>: move it out of the process into something all instances share.</p>
<pre class="code"># stateful — works on one server, breaks on two
sessions = {}
def login(user):    sessions[token] = user
def whoami(token):  return sessions.get(token)

# stateless — any server, same answer
def login(user):    redis.set("sess:"+token, user, ttl=3600)
def whoami(token):  return redis.get("sess:"+token)</pre>
<p>Where each kind of state goes:</p>
<ul><li><b>Sessions / auth →</b> Redis (shared, fast, TTL built in) — or a signed <b>JWT</b>, which puts the state inside the token so the server holds nothing at all.</li>
<li><b>Uploaded files →</b> object storage (S3). Never the local disk.</li>
<li><b>Caches →</b> a shared cache (Redis/Memcached), or accept that per-server caches are only an optimisation and must never be the source of truth.</li>
<li><b>Long-lived connections (WebSockets) →</b> unavoidable state. Route the same user to the same node with consistent hashing, and keep a registry of who is connected where.</li></ul>

<h5>When to use which</h5>
<ul><li><b>The app tier is always stateless.</b> This is not a trade-off; it is the rule. It is what lets you autoscale, deploy at noon, and lose a server without a page.</li>
<li><b>Some things are stateful by nature</b> — databases, caches, queues, connection gateways. Don't fight it. Isolate them, give them their own scaling story (replication, clustering, consistent hashing), and keep them out of the app tier.</li>
<li><b>Sticky sessions</b> (LB always routes a user to the same server) are a tempting shortcut. They "work" until that server is deployed or dies, then everyone on it is logged out. Use them only for genuinely connection-bound workloads.</li></ul>

<h5>In the wild</h5>
<ul><li><b>The Twelve-Factor App</b> (Heroku's manifesto, 2011) made "processes are stateless and share-nothing" a rule for cloud apps. Every modern platform — Kubernetes, Lambda, Cloud Run — assumes it.</li>
<li><b>Kubernetes</b> literally splits the world in two: <code>Deployment</code> for stateless services (replicas are identical, any can be killed) and <code>StatefulSet</code> for the stateful ones (stable names, ordered startup, persistent disks). Choosing the wrong one is a classic outage.</li>
<li><b>Slack's WebSocket gateways</b> are stateful — they hold millions of open connections. Slack scales them out anyway by routing each channel to a specific gateway with consistent hashing, and drains connections gracefully before deploying a node.</li></ul>

<h5>In the interview</h5>
<p>Two classic prompts. <i>"Users get logged out after every deploy — why?"</i> → sessions in process memory; move them to Redis or use JWTs. And the harder one: <i>"How do you deploy a WebSocket server without dropping everyone?"</i> → <b>connection draining</b>: stop sending new connections to the node, tell clients to reconnect (they'll land elsewhere), wait for existing connections to close, then replace it. Naming "draining" unprompted is the mid-level signal.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Stateless = any server can serve any request. It's the prerequisite for scaling out, autoscaling and safe deploys.</li><li>Externalise state: sessions to Redis or JWT, files to object storage, caches shared.</li><li>Stateful components exist — databases, queues, socket gateways. Isolate them and scale them their own way.</li></ul></div>`},

 {t:'Load balancing',i:'🚦',b:`
<h5>What it is</h5>
<p>A <b>load balancer</b> is the one address clients talk to. It accepts each request and forwards it to one of N backend servers. To the client there is one very reliable server; behind the curtain there are many ordinary ones.</p>

<h5>Why it exists</h5>
<p>The moment you have two app servers you need three things, and the load balancer provides all of them:</p>
<ul><li><b>Distribution:</b> spread work so no server drowns while another idles.</li>
<li><b>Availability:</b> notice a dead server and stop sending it traffic — automatically, in seconds, without a human.</li>
<li><b>Invisible change:</b> add servers, remove servers, deploy new versions, all behind a stable address. Clients never know.</li></ul>

<h5>How it works</h5>
<p>The core is the <b>selection algorithm</b>. Each has a personality:</p>
<pre class="code"># Round robin — take turns. Fair only if every request costs the same.
def pick(servers):  i = counter % len(servers); counter += 1; return servers[i]

# Least connections — send to whoever is least busy right now.
def pick(servers):  return min(servers, key=lambda s: s.active_connections)

# Weighted — big servers get proportionally more.  weights: A=3, B=1, C=1
def pick(servers):  return random.choices(servers, weights=[s.weight for s in servers])[0]

# Hash / sticky — same key, same server. Good for local caches; bad when a server dies.
def pick(servers, key):  return servers[hash(key) % len(servers)]   # (see: consistent hashing)</pre>
<p><b>Health checks</b> are what turn a distributor into a safety device. The LB hits each server's <code>/health</code> every few seconds; after ~3 consecutive failures the server is pulled from rotation, and after ~2 successes it is added back. Passive checks do the same thing by watching real responses for 5xx errors and timeouts.</p>
<p><b>Layer 4 vs Layer 7:</b> an L4 balancer sees only IP and port — it forwards TCP packets, blindingly fast, no idea what's inside. An L7 balancer terminates HTTP and can read it: route <code>/api/*</code> to one pool and <code>/static/*</code> to another, send 5% of traffic to a canary build, add headers, terminate TLS. L7 does more and costs more per request.</p>
<pre class="diag">                    ┌──────────────┐   /api/*    → api pool (3 servers)
 client ───────────►│  L7 balancer │   /static/* → cdn origin
  one IP, one name  │  health:5s   │   header X-Canary → new build (5%)
                    └──────────────┘</pre>

<h5>When to use which</h5>
<ul><li><b>Least connections</b> is the safe default for APIs, where a request can take 5 ms or 2 s. Round robin piles slow requests onto an unlucky server.</li>
<li><b>Round robin / weighted</b> when requests are uniform (static files, simple lookups) or servers differ in size.</li>
<li><b>Hash-based</b> when a server's local cache or open connection matters — and always with consistent hashing, so losing one server doesn't reshuffle everyone.</li>
<li><b>L4</b> for raw throughput, non-HTTP traffic (databases, game servers), or as the outer layer. <b>L7</b> whenever routing decisions depend on the request — which, for a web app, is nearly always. Large systems run both: L4 at the edge, L7 in front of services.</li></ul>

<h5>In the wild</h5>
<ul><li><b>AWS</b> ships the split as two products: NLB (L4, millions of connections/s, static IPs) and ALB (L7, path and host routing, WebSocket support). Most web apps sit behind an ALB.</li>
<li><b>Netflix Zuul</b> is an L7 gateway that inspects every request to route between hundreds of microservices, run canaries, and shed load during incidents — decisions an L4 device can't make.</li>
<li><b>Google Maglev</b> is an L4 balancer built in software on ordinary servers. It uses consistent hashing so that when a Maglev machine itself fails, existing connections still land on the same backends.</li>
<li><b>Nginx / HAProxy</b> are what you'd actually run yourself. Both do L4 and L7, both handle tens of thousands of requests per second on one core.</li></ul>

<h5>In the interview</h5>
<p>Expect three follow-ups in this order. <i>"Isn't the load balancer now your single point of failure?"</i> → run two in active-passive with a floating virtual IP, or use DNS to publish several LB addresses, or use the cloud provider's managed LB which is already distributed. <i>"What happens to in-flight requests when you remove a server?"</i> → connection draining: stop new traffic, let existing requests finish (bounded by a timeout), then remove. <i>"Users in Europe are slow"</i> → global load balancing: DNS or anycast sends each user to the nearest region, each region has its own LB.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>An LB gives you distribution, automatic failover via health checks, and the ability to change servers invisibly.</li><li>Least connections for APIs; round robin for uniform work; consistent hashing when locality matters.</li><li>L4 = fast and blind (IP/port). L7 = reads HTTP, can route by path, header, canary. Real systems use both.</li><li>The LB itself must be redundant: active-passive with a VIP, or a managed distributed LB.</li></ul></div>`}],
 lab:'lb',

 {q:'Traffic went up 10× overnight. App servers are at 20% CPU but pages are slow. What is the most likely bottleneck?',o:['Not enough app servers','The database','The load balancer algorithm','DNS'],a:1,w:'Stateless app servers at 20% CPU aren\'t the problem. When the app tier is idle but latency is high, the tier it waits on — the database — is saturated. Add read replicas and a cache before anything else.'},

{id:'cache',title:'Caching',icon:'⚡',intro:'"Add a cache" is the highest-leverage sentence in system design. Knowing where, which strategy, and what breaks is what separates mid-level from junior.',
 lessons:[
 {t:'Why caching works',i:'🏎️',b:`
<h5>What it is</h5>
<p>A <b>cache</b> is a copy of data kept somewhere faster than where it normally lives. You trade a little freshness and a little memory for a lot of speed — and, more importantly, you stop the slow, expensive system behind it from doing the same work over and over.</p>

<h5>Why it exists</h5>
<p>Storage is a ladder, and each rung is roughly 10–100× slower than the one above it:</p>
<pre class="diag">CPU cache          ~1 ns
RAM (same process) ~100 ns
Redis (same DC)    ~0.3–1 ms      ← network hop, but in memory
SSD read           ~0.1 ms local, ~2–10 ms through a DB query
Cross-region call  ~100–150 ms</pre>
<p>A database query that hits disk, parses SQL, plans, locks and returns is a 5–20 ms affair. The same answer from Redis is under 1 ms. That alone is nice; the real win is <b>load</b>. If 95% of reads are served from cache, your database handles 20× more users on the same hardware.</p>
<p>Caching works because access is wildly skewed. On any real system a tiny fraction of keys — the front page, today's popular posts, the logged-in user's profile — receive most reads. You do not need to cache everything; you need to cache the hot 1–5%.</p>

<h5>How it works</h5>
<p>Caches sit at every layer, and a request may pass through several before touching a database:</p>
<pre class="diag">browser cache → CDN edge → API gateway cache → app memory → Redis → database
 (per user)    (per region)  (per response)   (per server) (shared)  (truth)</pre>
<ul><li><b>Client / browser:</b> HTTP <code>Cache-Control</code> headers. Free, huge, and you don't control eviction.</li>
<li><b>CDN:</b> static assets and, increasingly, whole API responses, cached at edge nodes near users.</li>
<li><b>Application (in-process):</b> a dictionary in your server's RAM. Fastest possible, but each server has its own copy and they drift.</li>
<li><b>Distributed (Redis / Memcached):</b> a shared cache all servers read. One extra network hop; one source of truth for cached state.</li>
<li><b>Database internal:</b> buffer pools and query caches. Automatic, but the request still pays for the network round trip and query parsing.</li></ul>
<p>The metric that matters is the <b>hit rate</b>: hits ÷ (hits + misses). Effective latency is a weighted average:</p>
<pre class="code">effective_latency = hit_rate × cache_latency + (1 − hit_rate) × db_latency
                  = 0.95 × 1 ms + 0.05 × 20 ms = 1.95 ms   (10× better than no cache)
db_load           = (1 − hit_rate) × total_reads             (20× less)</pre>

<h5>When to cache (and when not to)</h5>
<ul><li><b>Cache</b> data that is read far more than it is written, expensive to compute, and tolerant of being seconds stale: profiles, product pages, feed lists, computed aggregates.</li>
<li><b>Don't cache</b> data that must be exactly right this instant (account balance at checkout, inventory during a flash sale) unless you also have a strategy to keep it right — see write-through in the next lesson.</li>
<li><b>Don't cache</b> low-hit-rate data. A cache with a 10% hit rate adds a network hop to 90% of requests and makes things slower.</li>
<li><b>Prefer a shared cache</b> over per-server memory once you have more than a couple of servers; per-server caches multiply the misses and disagree with each other.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Facebook</b> runs one of the largest Memcached deployments on earth; their 2013 paper describes billions of requests per second served from cache, with databases seeing only the misses. Their "lease" mechanism (see stampedes, lesson 3) was invented because cache misses at that scale can take down MySQL.</li>
<li><b>Reddit</b> caches rendered listing pages and vote counts aggressively; the front page you see is assembled from cached pieces and is typically a few seconds behind the database.</li>
<li><b>Netflix's EVCache</b> is a Memcached-based tier replicated across availability zones so that a zone failure doesn't turn into a miss storm against the backend.</li></ul>

<h5>In the interview</h5>
<p>"Add a cache" is the expected first move for any read-heavy component, so the points are in the specifics: <b>where</b> (Redis in front of the DB, plus CDN for static), <b>what</b> (which keys, and why they're hot), <b>hit rate you expect</b> (and what happens to the DB when it drops), and <b>what goes wrong</b> (staleness, invalidation, stampedes). A candidate who says "cache it in Redis with a 5-minute TTL, expect ~90% hits, so the DB sees a tenth of the reads" has answered four follow-ups before they were asked.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Caching trades freshness for speed and — the bigger win — removes load from the slow system behind it.</li><li>Access is skewed; cache the hot few percent, not everything.</li><li>Caches live at every layer: browser, CDN, app memory, Redis, database. Effective latency = hit rate × fast + miss rate × slow.</li></ul></div>`},

 {t:'Caching strategies: who writes the cache, and when',i:'🗺️',b:`
<h5>What it is</h5>
<p>A caching <b>strategy</b> answers two questions: on a read miss, who fetches from the database and fills the cache? And on a write, does the cache get updated, invalidated, or left alone? The four standard answers each pick a different point on the freshness/speed/complexity triangle.</p>

<h5>Why it exists</h5>
<p>Because the cache and the database are two copies of the same fact, and every write is a chance for them to disagree. If you write to the DB and forget the cache, users see old data until the TTL runs out. If you write to both, writes get slower and can half-fail. The strategy is how you decide which of those you can live with.</p>

<h5>How it works</h5>
<pre class="code"># 1. Cache-aside (lazy loading) — the app owns the logic. Most common.
def get_user(id):
    u = cache.get("user:"+id)
    if u is None:                       # miss
        u = db.query("SELECT ... WHERE id=?", id)
        cache.set("user:"+id, u, ttl=300)
    return u
def update_user(id, data):
    db.update(id, data)
    cache.delete("user:"+id)            # invalidate; next read refills

# 2. Read-through — the cache library fetches on miss; app just calls cache.get().
#    Same behaviour as cache-aside, less code, tighter coupling to one cache product.

# 3. Write-through — every write hits cache AND db, synchronously.
def update_user(id, data):
    db.update(id, data)
    cache.set("user:"+id, data)         # cache is never stale...
                                        # ...but every write pays two round trips

# 4. Write-behind (write-back) — write to cache now, flush to db later in batches.
def increment_views(post):
    cache.incr("views:"+post)           # sub-ms
    # a background job flushes counters to db every N seconds
    # if the cache node dies before the flush, those increments are gone</pre>
<p>A subtlety in cache-aside that interviewers love: on update, <b>delete</b> the key rather than setting the new value. Two concurrent updates that each <i>set</i> can race and leave the older value in cache; a delete just forces the next reader to fetch the truth.</p>

<h5>When to use which</h5>
<ul><li><b>Cache-aside</b> is the default. Read-heavy, tolerant of brief staleness, you want control. Downsides: first read is a miss; a bug in your invalidation is invisible until a user complains.</li>
<li><b>Read-through</b> when a library gives it to you for free (Guava, Caffeine, some ORMs) and you don't need custom miss handling.</li>
<li><b>Write-through</b> when a user must see their own write immediately and reads dominate anyway — settings pages, profile edits. Pay the write cost; it's rare.</li>
<li><b>Write-behind</b> for very high-volume, low-value writes where losing a few is acceptable: view counters, like counts, analytics events. Never for money.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Facebook / Instagram</b> use cache-aside with delete-on-write. A profile edit deletes the key; the next request repopulates from MySQL. Simple, and it scales to billions of keys because writes are cheap.</li>
<li><b>DynamoDB Accelerator (DAX)</b> is a managed write-through cache: writes go through DAX to DynamoDB, so reads through DAX are never stale. AWS built it because customers kept getting cache-aside invalidation wrong.</li>
<li><b>YouTube view counts</b> are the classic write-behind: the number you see is an approximation updated in batches, because writing every view to the source of truth in real time would be absurd.</li></ul>

<h5>In the interview</h5>
<p>Expect: <i>"You cache the product page. A merchant changes the price. What happens?"</i> Weak answer: "the TTL expires eventually." Strong answer: "Cache-aside with explicit invalidation — the price-update path deletes the cache key after the DB commit, so the next read fetches the new price. The TTL is only a safety net for bugs. If the price must be correct on the very next read across all servers, I'd use write-through for that field." Follow-up: <i>"Why delete instead of set?"</i> — the race described above.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Cache-aside: app reads through the cache, deletes the key on write. The default.</li><li>Write-through: writes hit both, cache never stale, writes slower.</li><li>Write-behind: fast writes, batched flush, risk of loss — counters and analytics only.</li><li>On update, delete the key; don't set it. Sets race.</li></ul></div>`},

 {t:'Invalidation, TTLs and the stampede',i:'🐃',b:`
<h5>What it is</h5>
<p><b>Invalidation</b> is how a cache learns that its copy is wrong. A <b>TTL</b> (time-to-live) is the blunt version: every entry expires after N seconds regardless. A <b>stampede</b> is what happens when a hot entry expires and every request that wanted it goes to the database at once.</p>

<h5>Why it exists</h5>
<p>The joke is that cache invalidation is one of the two hard problems in computer science. It's a joke because it's true: the cache doesn't know when the database changed unless something tells it, and "something" is every code path that writes. Miss one — a batch job, an admin tool, a second service — and you have stale data with no error and no log line.</p>
<p>TTLs exist so that when you inevitably miss one, the damage is bounded. Stampedes exist because TTLs are synchronous cliffs: at second 300 the key is there, at second 301 it is gone for everyone simultaneously.</p>

<h5>How it works</h5>
<p>Three invalidation tools, almost always used together:</p>
<ul><li><b>TTL:</b> bounds staleness to N seconds. Pick N by asking "how long can this be wrong before someone cares?" Profile: minutes. Stock price: seconds. Country list: days.</li>
<li><b>Event-driven delete:</b> the write path (or a change-data-capture stream off the DB log) deletes the key. Freshness is near-instant; coverage depends on catching every write path.</li>
<li><b>Versioned keys:</b> put a version in the key — <code>user:42:v17</code> — and bump the version on write. Old entries are simply never read again and expire on their own. No delete needed, and no race.</li></ul>
<p>Stampede defences:</p>
<pre class="code"># (a) request coalescing / lock — one request refreshes, the rest wait
def get(key):
    v = cache.get(key)
    if v: return v
    if cache.set(key+":lock", 1, nx=True, ttl=5):   # I won the lock
        v = db.load(key); cache.set(key, v, ttl=300); cache.delete(key+":lock")
        return v
    sleep(0.05); return get(key)                      # someone else is loading

# (b) early refresh — recompute a little before expiry, in the background
# (c) TTL jitter — ttl = 300 + random(0, 30), so keys don't all die together
# (d) serve stale — keep the old value while one request fetches the new one</pre>

<h5>When to use which</h5>
<ul><li><b>Always</b> set a TTL, even with perfect event-driven invalidation. It's the safety net.</li><li><b>Add event-driven delete</b> for anything a user edits and then immediately looks at.</li><li><b>Use versioned keys</b> when writes come from many places you don't control — it's the only approach that doesn't depend on every writer remembering to invalidate.</li><li><b>Add stampede protection</b> for any key whose miss cost is high or whose read rate is high. The front page needs it; a single user's settings page does not.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Facebook's "leases"</b> (from their Memcached paper): on a miss, Memcached hands the client a lease token; only the token holder may write the key back, and other clients are told to wait briefly. This is request coalescing at the cache layer and it exists because a hot-key miss once cascaded into a database outage.</li>
<li><b>Cloudflare and Fastly</b> both support <i>stale-while-revalidate</i>: keep serving the expired object while one background fetch refreshes it. Users never see the cliff.</li>
<li><b>Debezium / CDC pipelines</b> tail the database's write-ahead log and publish change events; a consumer deletes cache keys for every changed row. This is how you get invalidation coverage without touching every write path in the codebase.</li></ul>

<h5>In the interview</h5>
<p>The prompt is usually a scenario: <i>"A celebrity's profile is cached with a 5-minute TTL and they have 50 million followers. What happens at minute five?"</i> Say the word <b>stampede</b>, describe the 50 million (well, thousands) of simultaneous misses hitting the DB, then give two fixes: coalesce with a lock so one request refreshes, and refresh early or serve stale so the cliff never happens. Bonus: "and I'd add TTL jitter so hot keys don't expire in lockstep after a deploy that warmed them all at once."</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>TTL bounds staleness; event-driven delete gives freshness; versioned keys avoid races and missed writers. Use all three.</li><li>A stampede is a hot key expiring for everyone at once. Fix with coalescing, early refresh, stale-while-revalidate, jitter.</li><li>Pick TTLs by asking how long the data can be wrong before someone cares.</li></ul></div>`},

 {t:'Eviction, distributed caches and CDNs',i:'🧊',b:`
<h5>What it is</h5>
<p>Memory is finite, so a full cache must throw something away: that's <b>eviction</b>. Once one Redis box isn't enough, you spread keys across several: that's a <b>distributed cache</b>. And for static or public content, you push copies to servers near users worldwide: that's a <b>CDN</b>.</p>

<h5>Why it exists</h5>
<p>Eviction policy decides your hit rate as much as cache size does — the wrong policy can throw away tomorrow's hot key to make room for a one-off. Distribution exists because a single cache node caps out on memory (~hundreds of GB) and throughput (~100k ops/s), and because it's a single point of failure in front of your entire database. CDNs exist because the speed of light is a hard constraint: a user in Mumbai fetching from Virginia pays ~200 ms per round trip no matter how fast your servers are.</p>

<h5>How it works</h5>
<p><b>Eviction policies:</b></p>
<ul><li><b>LRU</b> (least recently used): evict what nobody has touched longest. Great for "recent is hot" workloads. Redis's default is an approximation of this.</li>
<li><b>LFU</b> (least frequently used): evict what is touched least often. Better when popularity is stable — a one-time scan of old data won't push out your evergreen keys.</li>
<li><b>TTL-based:</b> evict whatever expires soonest. Redis <code>volatile-ttl</code>.</li><li><b>FIFO / random:</b> cheap and usually worse. Used when the cache is tiny or eviction is rare.</li></ul>
<pre class="code"># LRU in one structure: an ordered map. Access → move to front. Full → drop the tail.
class LRU:
    def get(self, k):   v = self.d.pop(k, None); (v is not None) and self.d.__setitem__(k, v); return v
    def set(self, k, v): self.d.pop(k, None); self.d[k] = v
                         if len(self.d) > self.cap: self.d.popitem(last=False)   # evict oldest</pre>
<p><b>Distributing keys:</b> the client (or a proxy) hashes each key to a node. Plain <code>hash % N</code> remaps almost every key when N changes; <b>consistent hashing</b> (Level 3 lab) remaps only ~1/N of them. Redis Cluster does this with 16,384 fixed hash slots assigned to nodes; adding a node moves some slots.</p>
<p><b>Hot keys</b> are the distributed cache's weakness: one celebrity profile key lives on one node, and that node melts. Fixes: replicate the key across several nodes (<code>user:42:#1</code>, <code>#2</code>, <code>#3</code>, pick one at random), or add a tiny in-process cache in front just for the hottest few hundred keys.</p>
<p><b>CDN:</b> a <i>pull</i> CDN fetches from your origin on the first request for a URL and caches it at the edge; a <i>push</i> CDN is one you upload to ahead of time. Invalidate by purge API or, better, by never reusing a URL: <code>app.3f9a2c.js</code> changes name on every deploy, so old copies are simply never requested again.</p>

<h5>When to use which</h5>
<ul><li><b>LRU</b> by default. <b>LFU</b> when you've observed scans or bursts evicting things you wanted kept.</li>
<li><b>Redis</b> when you need data structures (lists for feeds, sorted sets for leaderboards, pub/sub, TTL per key, persistence). <b>Memcached</b> when you need a dead-simple multithreaded key-value cache and nothing else.</li>
<li><b>A CDN</b> for every static asset, always — and for public, cacheable API responses (a product listing, a public profile) once latency for far-away users matters.</li>
<li><b>Hot-key replication</b> only after you've measured a hot key. It complicates invalidation.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Twitter</b> caches timelines in Redis lists — each user's home timeline is a list of tweet IDs, pushed to on write. Sorted sets and lists are why they chose Redis over Memcached.</li>
<li><b>Netflix Open Connect</b> is a CDN Netflix built and ships as physical appliances into ISPs' data centres, so the video stream travels a few kilometres instead of across a continent. Roughly all of Netflix's video traffic is served this way.</li>
<li><b>Discord</b> ran into hot keys with popular servers and solved it with a small in-process cache in front of their distributed cache — the "L1/L2" pattern.</li></ul>

<h5>In the interview</h5>
<p>Three likely follow-ups. <i>"Redis or Memcached?"</i> — Redis if you need structures or persistence, Memcached if you only need get/set at massive scale. <i>"Your cache node dies — what happens?"</i> — every key on it misses at once; you want replication (Redis Sentinel/Cluster) or at minimum small nodes so one loss is a small miss storm. <i>"How does the CDN know a file changed?"</i> — it doesn't; you either purge or, better, version the URL.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>LRU is the default eviction; LFU when popularity is stable and scans are evicting good keys.</li><li>Distribute keys with consistent hashing; watch for hot keys and replicate them.</li><li>Redis for data structures and persistence; Memcached for pure key-value throughput.</li><li>CDNs beat the speed of light. Version URLs instead of purging.</li></ul></div>`}],

{id:'db',title:'Databases & Sharding',icon:'🗄️',intro:'The most consequential decision in your design. Interviewers want to see you pick a database for a reason and know what it costs to scale it.',
 lessons:[
 {t:'Choosing a database',i:'⚔️',b:`
<h5>What it is</h5>
<p>A database is where the truth lives. Choosing one is choosing what your system finds easy and what it finds hard — because every database is optimised for a shape of data and a pattern of access, and fights you when you bring it the wrong ones.</p>

<h5>Why it exists</h5>
<p>The "SQL vs NoSQL" debate is a category error. There is one kind of relational database and at least four kinds of non-relational ones, and they are built for different problems. The question is never "is NoSQL better?" It is "what are my queries, how much data, how often does it change, and what happens if two writes conflict?"</p>

<h5>How it works</h5>
<p><b>Relational (PostgreSQL, MySQL):</b> tables with a fixed schema, rows joined across tables by keys, <b>ACID</b> transactions (a group of writes either all happens or none does). The query planner lets you ask almost anything; indexes make it fast. Scales up beautifully, scales out (sharding) painfully.</p>
<p><b>Document (MongoDB, Couchbase):</b> JSON-ish documents, each with whatever fields it needs. Great when records vary in shape or you read a whole entity at once. Joins are weak; you denormalise instead.</p>
<p><b>Key-value (Redis, DynamoDB):</b> get/put by key, nothing else. Absurdly fast and scales out trivially because there is no relationship between keys. Sessions, caches, counters, shopping carts.</p>
<p><b>Wide-column (Cassandra, HBase, Bigtable):</b> rows grouped by a partition key, sorted by a clustering key, with columns that can differ per row. Built to scale writes out linearly across nodes. The price: you design tables around queries, not entities, and consistency is tunable-by-default-weak.</p>
<p><b>Graph (Neo4j):</b> nodes and edges are first-class; "friends of friends who like X" is one query instead of five joins. Use it when the relationships <i>are</i> the data.</p>
<p><b>Search (Elasticsearch, OpenSearch):</b> inverted indexes for text and faceted queries. Never the source of truth; always fed from another store.</p>
<pre class="diag">"Do I need ACID / uniqueness / multi-row transactions?"   → yes → relational
"Do records vary wildly in shape?"                         → yes → document
"Is it pure lookup by key at huge scale?"                  → yes → key-value
"Are writes enormous and time-ordered (logs, messages)?"   → yes → wide-column
"Is the query about hops between things?"                  → yes → graph
"Is it text search or facets?"                             → yes → search index (secondary)</pre>

<h5>When to use which</h5>
<ul><li><b>Default to relational.</b> Postgres handles JSON columns, full-text search, and hundreds of thousands of rows per second on one box. You need a reason to leave it.</li>
<li><b>Reach for a document store</b> when the schema genuinely differs per record (product attributes, CMS content) and you rarely need cross-document joins.</li>
<li><b>Reach for wide-column</b> when a single table will hold billions of rows growing forever and your queries are all "everything for this partition, in time order" — chat messages by channel, sensor readings by device.</li>
<li><b>Use several.</b> Real systems combine a relational core with Redis in front and Elasticsearch beside it. "Polyglot persistence" is normal; picking one store for everything is the smell.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Airbnb:</b> bookings and payments in MySQL (a room cannot be double-booked — that's a transaction), sessions and rate limits in Redis, search in Elasticsearch. Each store does one job.</li>
<li><b>Discord:</b> started on MongoDB, moved messages to Cassandra at ~1 billion messages because the workload — append-only, read by channel, in time order — is exactly what wide-column is for. Later moved again to ScyllaDB (same model, better tail latency).</li>
<li><b>Instagram:</b> sharded PostgreSQL for the core graph and media metadata, years past a billion users. Relational scaled fine; they just had to shard it themselves.</li></ul>

<h5>In the interview</h5>
<p>Never say "I'd use MongoDB because it scales." Say <i>what the queries are</i> and pick the store that makes them cheap: "Orders need transactions and joins against users and products, so Postgres. Chat messages are append-only and read by conversation in time order at high write volume, so Cassandra partitioned by <code>conversation_id</code>." If pressed on "can SQL scale?", give the ladder: indexes → read replicas → connection pooling → cache → bigger box → shard. Most companies never reach the last rung.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Pick a store by query shape, data shape, volume and consistency needs — not by fashion.</li><li>Relational by default; document for varied shapes; key-value for lookups; wide-column for huge time-ordered writes; graph for hops; search as a secondary index.</li><li>Real systems use several stores. That's normal.</li></ul></div>`},

 {t:'Indexes: how reads get fast',i:'🔎',b:`
<h5>What it is</h5>
<p>An <b>index</b> is a separate, sorted structure the database maintains so it can find rows without reading the whole table. It's the difference between scanning every page of a book and flipping to the index at the back.</p>

<h5>Why it exists</h5>
<p>Without an index, <code>WHERE email = ?</code> on a 100-million-row table reads all 100 million rows. With a B-tree index on <code>email</code> it reads about four pages. That's the single biggest performance lever in most applications, and the most common cause of "the site is slow" tickets is a query that grew past the size where a full scan was tolerable.</p>

<h5>How it works</h5>
<p><b>B-tree</b> (the default everywhere): a balanced tree of sorted keys, each leaf pointing to rows. Lookup, range scan (<code>age BETWEEN 25 AND 30</code>), and <code>ORDER BY</code> on the indexed column are all O(log n). Depth is 3–4 levels even for billions of rows.</p>
<p><b>Hash index:</b> O(1) for exact match, useless for ranges or sorting. Rarely worth it over a B-tree.</p>
<p><b>Composite index</b> on <code>(country, created_at)</code>: sorted by country, then by date within each country. It serves <code>WHERE country=?</code>, and <code>WHERE country=? AND created_at > ?</code>, but <b>not</b> <code>WHERE created_at > ?</code> alone — the leftmost column must be constrained. Column order is the whole design.</p>
<p><b>Covering index:</b> if the index contains every column the query needs, the DB never touches the table at all.</p>
<p><b>Inverted index</b> (full-text): for each word, the list of documents containing it. This is what Elasticsearch is.</p>
<pre class="code">-- The interviewer's favourite: which of these can use INDEX (country, created_at)?
SELECT * FROM users WHERE country = 'IN';                           -- yes (prefix)
SELECT * FROM users WHERE country = 'IN' AND created_at > '2026';   -- yes (both)
SELECT * FROM users WHERE created_at > '2026';                      -- NO (skips leftmost)
SELECT * FROM users WHERE country = 'IN' ORDER BY created_at DESC;  -- yes, and no sort step

-- Always check. EXPLAIN tells you whether it's a Seq Scan or an Index Scan.
EXPLAIN ANALYZE SELECT ...;</pre>
<p>The cost: every index must be updated on every INSERT/UPDATE/DELETE, and it takes disk. A table with ten indexes writes roughly ten times slower than one with none.</p>

<h5>When to index (and when not to)</h5>
<ul><li><b>Index</b> columns that appear in <code>WHERE</code>, <code>JOIN ... ON</code>, and <code>ORDER BY</code> of frequent queries. Foreign keys, always.</li>
<li><b>Composite index</b> when queries filter on several columns together; put the most selective equality column first, the range column last.</li>
<li><b>Don't index</b> low-cardinality columns alone (a boolean has two values; the index barely narrows anything), columns that are rarely queried, or every column on a write-heavy table "just in case".</li>
<li><b>Don't rely on the index to fix a bad query.</b> <code>WHERE lower(email) = ?</code> can't use an index on <code>email</code>; index the expression or store it normalised.</li></ul>

<h5>In the wild</h5>
<ul><li><b>GitHub</b> has written about outages caused by a single missing index after a schema change made a hot query fall back to a table scan. The fix took minutes; finding it took hours.</li>
<li><b>Instagram</b> denormalises and indexes the "likes" relationship in both directions — who liked this photo, and what did this user like — because each direction is a hot query and one index can't serve both.</li>
<li><b>Stack Overflow</b> publishes their slow-query dashboards; almost every regression in their history is "query stopped using the index".</li></ul>

<h5>In the interview</h5>
<p>Indexes come up whenever you say "query the DB by X". Expect <i>"How is that fast?"</i> — name the index and its columns. Then <i>"What's the cost?"</i> — slower writes, more disk, and a composite index only helps queries that use its leftmost columns. A strong move: when you design a table, state its indexes in the same breath: "<code>messages(channel_id, created_at)</code>, indexed on that pair, so 'latest 50 in this channel' is one index range scan."</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>An index turns a full scan into a tree lookup. B-tree is the default; it handles equality, ranges and ordering.</li><li>Composite indexes serve queries that use their leftmost columns; column order is the design.</li><li>Every index slows every write. Index what you query; nothing else.</li></ul></div>`},

 {t:'Replication: copies for reads and for survival',i:'🪞',b:`
<h5>What it is</h5>
<p><b>Replication</b> keeps the same data on more than one database node. Its two jobs are unrelated and both essential: serve more reads than one machine can, and keep the data alive when a machine dies.</p>

<h5>Why it exists</h5>
<p>A single database is the last single point of failure in a scaled-out system, and it's the one that loses data when it goes. Replication gives you a live copy to fail over to. And since most workloads are read-heavy, those copies can also answer queries — which is how you scale reads without touching the write path at all.</p>

<h5>How it works</h5>
<p><b>Leader–follower</b> (primary–replica): one node accepts writes; it streams its change log to followers, who apply the same changes. Readers can go to any follower.</p>
<pre class="diag">                 writes
 app ───────────────────────►  LEADER
                                 │ replication log (async or sync)
              reads              ▼
 app ──────────────────►  FOLLOWER 1   FOLLOWER 2   FOLLOWER 3</pre>
<ul><li><b>Asynchronous replication:</b> the leader acknowledges the write before followers have it. Fast; a leader crash can lose the last few writes.</li>
<li><b>Synchronous:</b> the leader waits for at least one follower to confirm. No loss on failover; every write pays a round trip. Most setups do "one sync, rest async".</li></ul>
<p><b>Replication lag</b> is the gap between leader and follower — usually milliseconds, sometimes seconds under load. It produces the classic bug: a user saves their profile (write hits leader), the page reloads (read hits a follower that hasn't caught up), and their change appears to vanish.</p>
<pre class="code"># Read-your-own-writes: after a user writes, pin their reads to the leader briefly
def read_user(id, session):
    if time.now() - session.last_write_at < 5s:
        return leader.query(...)          # guaranteed fresh
    return follower.query(...)            # fast, possibly a few ms stale</pre>
<p><b>Failover:</b> leader dies → a monitor notices (missed heartbeats) → a follower is promoted → clients are pointed at it. Automated by Patroni, RDS, Sentinel, etc. The danger is <b>split brain</b>: the old leader wasn't dead, just partitioned, and now two nodes accept writes. Fencing (the old leader must prove it's still leader before each write) prevents it.</p>
<p><b>Multi-leader</b> (active-active): several nodes accept writes, typically one per region. Low write latency everywhere; conflicts when two regions edit the same row, which you must resolve (last-write-wins, merge, or app logic).</p>

<h5>When to use which</h5>
<ul><li><b>Leader–follower, async, with one sync follower</b> is the workhorse. Use it for basically every relational deployment.</li>
<li><b>Route reads to followers</b> once the leader's CPU is the bottleneck. Keep reads that must be fresh on the leader.</li>
<li><b>Multi-leader</b> only when users on different continents both write and cross-region write latency is unacceptable — and only if you have a conflict story.</li>
<li><b>Sync-only replication</b> for data where losing one committed write is unacceptable (ledgers), accepting slower writes.</li></ul>

<h5>In the wild</h5>
<ul><li><b>GitHub's 2018 outage:</b> a 43-second network partition triggered automatic failover; the two sides ended up with divergent writes (split brain), and recovery took 24 hours. It's the canonical story of why fencing and careful failover matter.</li>
<li><b>Amazon RDS Multi-AZ</b> is synchronous replication to a standby in another zone with automatic failover — the managed version of "one sync follower".</li>
<li><b>Facebook's TAO</b> layers read caches over MySQL replicas across regions and explicitly documents read-after-write behaviour, because at their scale replication lag is user-visible.</li></ul>

<h5>In the interview</h5>
<p>The scenario: <i>"User edits their name, refreshes, sees the old name. Why, and what do you do?"</i> Name replication lag; propose read-your-own-writes (route that user to the leader for a few seconds, or compare a version stamp and retry). Then the follow-up: <i>"The leader dies — walk me through it."</i> Heartbeats, promotion, client redirect, and the split-brain risk — and that async replication can lose the last writes, so ask whether that's acceptable for this data.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Replication scales reads and survives node loss. Leader takes writes; followers copy and serve reads.</li><li>Async is fast but can lose recent writes on failover; sync is safe but slower. Usually one sync follower.</li><li>Replication lag → read-your-own-writes. Failover → beware split brain; fence the old leader.</li></ul></div>`},

 {t:'Sharding: when one database cannot hold the writes',i:'🔪',b:`
<h5>What it is</h5>
<p><b>Sharding</b> (horizontal partitioning) splits one logical table across many independent databases, each holding a slice of the rows. Each shard has its own leader, followers, disk and CPU. Add shards, add write capacity.</p>

<h5>Why it exists</h5>
<p>Replication scales reads. Nothing so far scales <b>writes</b> or <b>storage</b>: every write still lands on one leader with one disk. When that leader is the biggest box money buys and it's still at 90% — or the table is 20 TB and backups take a week — you shard. It's the last rung on the ladder because it's the one that changes your application.</p>

<h5>How it works</h5>
<p>Every row has a <b>shard key</b>; a function maps the key to a shard. Three families:</p>
<pre class="code"># Range:      users A–H → shard 1, I–P → shard 2, Q–Z → shard 3
#             good for range queries; hotspots (everyone signed up this month → one shard)
# Hash:       shard = hash(user_id) % N
#             even spread; ranges scatter; adding a shard remaps everything (→ consistent hashing / fixed slots)
# Directory:  a lookup table  user_id → shard
#             fully flexible; the table is a hot dependency and a SPOF

def shard_for(user_id):            # hash with fixed "virtual buckets" so resharding moves buckets, not keys
    bucket = hash(user_id) % 1024
    return BUCKET_TO_SHARD[bucket]  # move a few buckets to a new shard; don't rehash the world</pre>
<p>What you give up the moment you shard:</p>
<ul><li><b>Cross-shard joins.</b> "Orders for users in Texas" now means asking every shard and merging. You pre-join by denormalising, or accept scatter-gather queries for rare reports.</li>
<li><b>Cross-shard transactions.</b> Moving money from a user on shard 1 to one on shard 3 isn't one ACID transaction any more. You use sagas, two-phase commit, or design so it never happens.</li>
<li><b>Global auto-increment IDs.</b> Two shards will both hand out id 1001. Use UUIDs or Snowflake-style IDs (timestamp + shard id + sequence).</li>
<li><b>Simple operations.</b> Schema migrations, backups and "how many users do we have" become N problems.</li></ul>
<p>The whole design is the shard key. A good key puts the rows your hot queries need <b>on the same shard</b> and spreads load evenly. Chat messages by <code>channel_id</code>: "load this channel" hits one shard. By <code>message_id</code>: every channel is scattered everywhere — useless. By <code>created_at</code>: all of today's writes hit one shard — a hotspot.</p>

<h5>When to shard (and when not to)</h5>
<ul><li><b>Don't</b> until you've exhausted indexes, read replicas, caching, archiving cold data, and a bigger box. Every one of those is cheaper.</li>
<li><b>Do</b> when write throughput or data volume exceeds one machine and it's growing. Plan it before you need it: pick the key, use fixed buckets, and design the app to always know its shard key.</li>
<li><b>Consider a database that shards for you</b> (Cassandra, DynamoDB, CockroachDB, Vitess for MySQL, Citus for Postgres) so the mechanics aren't your problem — you still choose the key.</li></ul>

<h5>In the wild</h5>
<ul><li><b>Discord</b> shards messages by <code>channel_id</code> (with a time bucket appended so one giant channel doesn't become one giant partition). Their write-up walks through exactly why a bad key — <code>message_id</code> — was rejected.</li>
<li><b>Instagram</b> shards Postgres by user ID across thousands of logical shards mapped onto far fewer physical servers, so "add a server" means "move some logical shards", not "rehash". Their ID generator packs timestamp + shard + sequence into 64 bits.</li>
<li><b>Notion</b> sharded Postgres by workspace ID in 2021, moving from one monolithic DB to 480 logical shards on 32 physical hosts, precisely because the single box was at capacity and backups had become impractical.</li></ul>

<h5>In the interview</h5>
<p>Once you say "shard", expect three things in order: <i>"What's the shard key and why?"</i> (name the hot query it keeps on one shard), <i>"What can't you do any more?"</i> (cross-shard joins/transactions, global IDs), and <i>"How do you add a shard later?"</i> (fixed buckets or consistent hashing so you move slices, not everything). Bonus points for saying it's a last resort and listing what you'd try first.</p>

<div class="takeaways"><b>Say these from memory</b><ul><li>Sharding scales writes and storage by splitting rows across independent databases. Last resort; changes the app.</li><li>The shard key is the design: keep hot queries on one shard, spread load evenly, avoid time-based keys.</li><li>You lose cross-shard joins, transactions and simple IDs. Use fixed buckets so resharding is cheap.</li></ul></div>`}],
